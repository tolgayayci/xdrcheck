[conformance.columns]
# column sets live in drivers/sets.toml and the columns in drivers/sets.d/; versions below are the only ones
# allowed there. One family per line, with a comment line between families, so a change to one family never
# touches the lines of another.
# JavaScript: @stellar/stellar-sdk, both API lines (drivers/sets.d/js.toml, js16.toml)
js = ["17.4.0", "17.3.0", "17.2.1", "17.2.0", "16.4.1", "16.3.1", "16.3.0"]
# Go: go-stellar-sdk (drivers/sets.d/go.toml)
go = ["v0.9.0", "v0.8.0", "v0.7.3", "v0.7.2", "v0.7.1"]
# Rust: stellar-xdr (drivers/sets.d/rust.toml)
rust = ["30.0.0", "28.0.1", "28.0.0"]
# Python: stellar-sdk (drivers/sets.d/python.toml)
python = ["17.0.1", "17.0.0"]
# Contract-spec reader (drivers/sets.d/spec.toml)
soroban-spec = ["30.0.0-rc.1", "29.0.1"]   # contract-spec reader; 30.0.0 exists only as rc.1
# XDR-JSON converter (the json level). rs-xdr-json 30.0.0+ebec5fb1c76e is rs-stellar-xdr main at commit
# ebec5fb1c76e2bcd17ec2fe9aae4203a6251f660 (crate version 30.0.0, the commit as build metadata).
rs-xdr-json = ["30.0.0", "30.0.0+ebec5fb1c76e"]

