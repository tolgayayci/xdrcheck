# Single source of every version the kit builds against or tests.
# Tools read this file; `xdrcheck pins check` rejects any version named elsewhere.
# Rationale: the Protocol 30 stable stack. Protocol 30 stable stack as of 2026-11-12.

[protocol]
max_supported = 30
network_mainnet = 29          # mainnet protocol on 2026-11-14; `xdrcheck pins check --network` compares it with Horizon
network_testnet = 30          # testnet upgraded at ledger 5540313

# Dated network changes the pins depend on. `xdrcheck pins check` reads them against today's date (UTC): from 14
# days before an event it warns; once the event's day has passed and `pin` still holds `until`, it fails with
# `action`. `xdrcheck pins check --network` also warns about a scheduled upgrade or reset on the status page that is
# missing here. Record a new event as soon as it is announced; remove one once its pin has moved.
[[schedule]]
event = "Mainnet vote on Protocol 30"
date = "2026-11-23"           # 17:00 UTC
source = "https://status.stellar.org scheduled maintenance 'Stellar Public Network Protocol Upgrade Vote', 2026-11-23T17:00Z (posted 2026-10-20)"
pin = "protocol.network_mainnet"
until = "29"
action = "confirm the result with `xdrcheck pins check --network` (Horizon current_protocol_version), then set protocol.network_mainnet = 30; if the vote was postponed, move this event's date"

[[schedule]]
event = "Testnet reset"
date = "2026-12-16"           # 17:00 UTC
source = "https://developers.stellar.org/docs/networks (Testnet and Futurenet data reset: scheduled 2026 dates); not yet on status.stellar.org on 2026-11-14"
pin = "public_lake.testnet"
until = "testnet/2025-12-18"
action = "move public_lake.testnet to the new epoch's prefix in the public lake, then run `xdrcheck-corpus refetch --network testnet` (docs/maintenance.md, section 8)"

[ci]
mise = "2026.8.10"           # the version mise-action installs; CI fails if absent
actionlint = "1.7.12"

