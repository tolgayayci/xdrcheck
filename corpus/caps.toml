# corpus/caps.toml: the CAP inventory as data, read by `xdrcheck-corpus coverage` (coverage.json, COVERAGE.md).
#
# Every CAP file of stellar-protocol at ced008c3727005ca4a775f430fe6fe346c30f58f (core/cap-*.md, 102
# files) has one [[cap]] record: its title and status from the preamble, its protocol, and whether it
# changed what a reader of ledger data sees, judged from the XDR and stellar-core at the pinned tags, not
# from CAP prose.
#
# [[cap]] fields
#   file            the CAP file name
#   title, status   from the preamble
#   protocol        the protocol it shipped in (preamble; omitted when the preamble says TBD)
#   protocol_note   the preamble value when it is not a single number
#   reader_visible  true if ledger readers see a new shape or value
#   group           (reader-visible) the coverage row it counts under: cap-NNNN; a CAP and its
#                   sub-documents share their parent's row (cap-0046, cap-0071)
#   changed         (on the row's own CAP) what changed for readers
#   reason          (not reader-visible) why it needs no entry: no ledger-visible shape, or not implemented
#   gap_reason      why the row has no corpus entry and none is planned
#   twins_reason    why the row has no entry with both testnet and pubnet variants and none is planned
#
# [[group]] records are coverage rows that are not a CAP: protocol-gated changes without a CAP of their own
# (protocol-NN) and cross-cutting encoding rules. Same fields as above where they apply.
#
# A corpus entry counts under the row of each CAP in its `caps` list and under the row named by the
# group part of its ID. A planned row of corpus/plan.json counts the same way.

