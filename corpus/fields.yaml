# corpus/fields.yaml — source of the guide's field-by-field table (check guide-table). Schema:
# corpus/schema/fields.schema.json. Checked by scripts/py/check_fields.py.
#
# Origin: a field-by-field reading of stellar-core v30.0.0 (rows VF-01…VF-52), with demonstrations
# from an executed local-core scenario run (ledger numbers "L14" etc. in demonstration notes),
# captured public-network ledgers and an SDK decoding matrix. VF-53 (the emitting-contract rule)
# was added after an independent design review.
#
# Empty reader_may_assume / reader_must_not_assume: the row makes no such statement (the
# generated table prints an empty cell).
#
# status:       validated | partially_validated | passed_through
#                A row marked partially_validated carries `parts`; each part has exactly one status.
#                The generated table has one line per part (VF-02a, VF-02b), never a mixed line.
#                Part status `undetermined` = the claim is not yet established either way.
# verification:  executed        = a core-emitted ledger or an executed probe demonstrates the row's key claim
#                code_reference  = read from source at the pinned tag only
#                unverified      = the row's key claim is not yet backed by either
#                A row or part marked unverified (or status undetermined) is left out of the published
#                table and listed in the guide's "not yet established" appendix with its reason.
# spot_checked:  true = every code_ref of the row was re-read against the pinned commits below
#                (`check_fields.py --print-refs` prints the cited lines for review).
# demonstrated_by: canonical corpus entry IDs, every one a row or `<row>.<member>` in corpus/plan.json
#                (docs/entry-ids.md has the rules). The values here are the planning list carried
#                over from the design phase. The reference is held in ONE direction: a manifest entry
#                cites row or part IDs in its `fields` block, and `demonstrated_by` is regenerated
#                from the manifest by the guide generator, never maintained by hand.
#
# What CI enforces for the guide-table check ("the field-by-field table agrees with the corpus manifest"):
#   1. every row or part ID cited by a manifest entry exists in this file;
#   2. the status list an entry cites a row under (validated / partially_validated / passed_through)
#      equals the status of that row or part here;
#   3. every published row or part is cited by at least one manifest entry whose bytes exist, or has a
#      recorded `no_demonstration_reason`;
#   4. every entry ID here is a canonical ID;
#   5. the table committed in the guide equals the table generated from this file joined with the manifest;
#   6. no row or part with verification `unverified` or status `undetermined` appears in the published table.
# A generated table agrees with its source by construction, so conditions 1–4 and 6 are the ones that
# can fail. Whether each row's claim is TRUE is not a CI matter: that is the review by a core or
# platform engineer (check guide-review).
#
# Stage codes (see `stages` below) are used in core_checks[].stage.

schema: xcc.fields/v1
pins:
  stellar_core: {tag: v30.0.0, commit: 0e49751aa9ddf892302cca02cea7f3f5d97df9f1}
  stellar_xdr: {tag: v30.0, commit: 4f524bbac80c781c06e4fb5fc93a2d0d331d6705}
  soroban_env_host:
    commit: 6e6c4a87f46c7fdab0c2e2be82901b1e32378223
    note: "stellar-core v30.0.0's p30 host submodule pin. The rs-soroban-env tag v30.0.0 is 0c99950e; do not label 6e6c4a87 as the tag."
  code_ref_convention: "Paths are relative to the stellar-core tree at the pinned tag. 'xdr:' = stellar-xdr at the pinned commit. 'env:' = rs-soroban-env at the pinned host commit."

stages:
  D0: "Overlay XDR decode (xdrpp; marshaling stack limit 1500, src/main/main.cpp:425). Shape, lengths, padding, discriminants. No semantics."
  D1: "validateXDRForProtocol (src/transactions/TransactionUtils.cpp:1350-1378). Envelope depth: xdrpp 500 before Protocol 28, Rust parse at depth 1000 from Protocol 28; protocol gating of XDR arms."
  D2: "XDRProvidesValidFee (src/transactions/TransactionFrame.cpp:1774-1790)."
  C1: "commonValidPreSeqNum (src/transactions/TransactionFrame.cpp:1241-1495). State-independent checks, Soroban resources, time and ledger bounds, minimum fee, source exists."
  C2: "commonValid (src/transactions/TransactionFrame.cpp:1608-1728). Sequence number, min-seq age and gap, transaction-level signatures, balance covers fee."
  C3: "Per-operation checkValid / doCheckValid (src/transactions/OperationFrame.cpp:283-363)."
  C4: "checkAllSignaturesUsed (src/transactions/TransactionFrame.cpp:1904-1907; src/transactions/SignatureChecker.cpp:172-191)."
  T: "Transaction-set validity (src/herder/TxSetFrame.cpp:1789-1845): every validator re-runs C1-C4 against the last closed ledger for every transaction in a proposed set."
  A: "Apply (src/transactions/TransactionFrame.cpp:2028-2098, 2301-2495). C1-C4 re-run against in-ledger state, then doApply. A failure here still puts the transaction in the ledger."
  H: "Soroban host (env:soroban-env-host/src/e2e_invoke.rs:470-570). Decode at depth 500, value conversion at depth 100, authorization."

general_rule: >-
  A transaction that appears in a ledger passed every stateless check against the last closed ledger.
  A transaction that appears with a failed result may have failed any stateful check. Readers branch on
  TransactionResult.result.code, never on the envelope alone.

fields:
  - id: VF-01
    field: TransactionEnvelope.type
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C1, what: "From Protocol 13 ENVELOPE_TYPE_TX_V0 is not supported; before Protocol 13 ENVELOPE_TYPE_TX and any muxed account are not supported.", code_ref: "src/transactions/TransactionFrame.cpp:1256-1264"}
    reader_may_assume: "V0 envelopes occur only in pre-Protocol-13 history."
    reader_must_not_assume: "That V0 envelopes never need decoding: full-history readers still meet them."
    result_code_when_rejected: [txNOT_SUPPORTED]
    verification: executed
    spot_checked: true
    demonstrated_by: ["protocol-13/upgrade-ledger-header-13-envelopes-v0"]
    demonstration_note: "history, pubnet 30191538: header 13, 450 of 450 envelopes tx_v0"

  - id: VF-02
    field: Transaction.sourceAccount
    controlled_by: submitter
    status: partially_validated
    status_detail: "ed25519 key: validated. Muxed ID: passed through."
    parts:
      - {id: VF-02a, aspect: "The ed25519 key", status: validated, verification: executed}
      - {id: VF-02b, aspect: "The muxed ID", status: passed_through, verification: executed}
    core_checks:
      - {stage: C1, what: "The ed25519 key must be an existing account.", code_ref: "src/transactions/TransactionFrame.cpp:1473-1478"}
      - {stage: C2, what: "The account's signers must meet the LOW threshold.", code_ref: "src/transactions/TransactionFrame.cpp:1683-1688"}
      - {stage: C1, what: "The muxed ID is stripped before any use (toAccountID).", code_ref: "src/transactions/TransactionUtils.cpp:1185-1201"}
      - {stage: C1, what: "From Protocol 25 an InvokeHostFunction transaction must not have a muxed source (validateSorobanMemo).", code_ref: "src/transactions/TransactionFrame.cpp:341-369, 1315-1328"}
    reader_may_assume: "The key names a real account that authorized the transaction."
    reader_must_not_assume: "Anything about the muxed ID: it is an arbitrary 64-bit label and is never checked."
    result_code_when_rejected: [txNO_ACCOUNT, txBAD_AUTH, txSOROBAN_INVALID]
    verification: executed
    spot_checked: true
    demonstrated_by:
      - "cap-0027/muxed-source-and-destination-max-ids"  # local-core probe L14: source M with ID 2^64-1
      - "cap-0027/muxed-source-id-above-2-pow-63"  # history, pubnet 53071228, tx 64270266…932c

  - id: VF-03
    field: Transaction.fee
    controlled_by: submitter
    status: validated
    status_detail: "Validated as a bid, not as the amount paid."
    core_checks:
      - {stage: C1, what: "Inclusion fee must be at least baseFee times max(1, number of operations).", code_ref: "src/transactions/TransactionFrame.cpp:1460-1465"}
      - {stage: C2, what: "Available balance must cover the fee.", code_ref: "src/transactions/TransactionFrame.cpp:1695-1708"}
      - {stage: A, what: "The fee charged is the declared Soroban resource fee (if any) plus min(inclusion-fee bid, base fee times max(1, number of operations)) from Protocol 11; before Protocol 11 the full bid.", code_ref: "src/transactions/TransactionFrame.cpp:395-426"}
    reader_may_assume: "The fee source could afford the bid when the transaction was applied."
    reader_must_not_assume: "That the envelope fee was paid. Use TransactionResult.feeCharged and the fee changes in meta."
    result_code_when_rejected: [txINSUFFICIENT_FEE, txINSUFFICIENT_BALANCE]
    verification: code_reference
    spot_checked: true
    demonstrated_by: ["cap-0015/fee-bump-muxed-fee-source-inner-failed"]
    demonstration_note: "local-core probe L18: outer fee 200 charged, inner fee_charged 0"

  - id: VF-04
    field: Transaction.seqNum
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C2, what: "Must equal the account's sequence + 1; when minSeqNum is set (Protocol 19+) the account's sequence must instead lie in [minSeqNum, seqNum). Never the ledger's starting sequence number.", code_ref: "src/transactions/TransactionFrame.cpp:1581-1605"}
      - {stage: A, what: "The sequence number is consumed even when the transaction later fails.", code_ref: "src/transactions/TransactionFrame.cpp:1670, 2082-2085"}
    reader_may_assume: "The sequence number is consumed on ledger for every transaction that got past C1 at apply."
    reader_must_not_assume: "That it is consumed when the transaction failed C1 at apply (for example txTOO_LATE)."
    result_code_when_rejected: [txBAD_SEQ]
    verification: executed
    spot_checked: true
    demonstrated_by: ["classic/failed-and-successful-path-payment-amounts", "cap-0015/fee-bump-muxed-fee-source-inner-failed", "cap-0034/tx-too-late-with-fee-charged"]
    demonstration_note: "local-core scenarios: a failed path payment and a failed fee-bump inner transaction each consume the source's sequence number; pubnet 30379767 (Protocol 13): a txTOO_LATE result leaves it unchanged"

  - id: VF-05
    field: Transaction.ext
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C1, what: "Classic transactions: from Protocol 21 ext.v must be 0.", code_ref: "src/transactions/TransactionFrame.cpp:1417-1436"}
      - {stage: D2, what: "Soroban transactions: ext.v must be 1.", code_ref: "src/transactions/TransactionFrame.cpp:1774-1790"}
    reader_may_assume: "A Soroban transaction in a ledger carries SorobanTransactionData."
    reader_must_not_assume: ""
    result_code_when_rejected: [txMALFORMED]
    verification: code_reference
    spot_checked: true
    demonstrated_by: ["cap-0067/sac-transfer-to-muxed-account"]
    demonstration_note: "local-core probe L29"

  - id: VF-06
    field: "TransactionV1Envelope.signatures<20>"
    controlled_by: submitter
    status: validated
    status_detail: "For transactions that got past C2. Signatures of a transaction that failed C1 or C2 at apply may be unverified."
    core_checks:
      - {stage: D0, what: "At most 20 by XDR.", code_ref: "xdr:Stellar-transaction.x:929, 972, 998"}
      - {stage: C2, what: "Each must verify against a signer of the transaction source, an operation source, or an extra signer.", code_ref: "src/transactions/TransactionFrame.cpp:483-528"}
      - {stage: C4, what: "Every signature must have been used.", code_ref: "src/transactions/SignatureChecker.cpp:172-191"}
      - {stage: C2, what: "From Protocol 28 at most 1000 ed25519 verifications per transaction (enforced in overlay validation at every protocol).", code_ref: "src/transactions/SignatureChecker.h:46-50; src/transactions/SignatureChecker.cpp:31-44; src/util/ProtocolVersion.h:85-86"}
    reader_may_assume: "In txSUCCESS and most txFAILED results every signature was used."
    reader_must_not_assume: "That signatures were verified in results that failed C1 or C2 during apply (src/transactions/TransactionFrame.cpp:1533-1547)."
    result_code_when_rejected: [txBAD_AUTH_EXTRA, txBAD_AUTH]
    verification: code_reference
    spot_checked: true
    demonstrated_by: ["classic/operations-100-signatures-20", "cap-0021/precond-v2-all-fields"]

  - id: VF-07
    field: DecoratedSignature.hint
    controlled_by: submitter
    status: partially_validated
    status_detail: "Used only as a filter for which signer to try."
    parts:
      - {id: VF-07a, aspect: "That each signature counted toward a threshold verified against a real signer", status: validated, verification: executed}
      - {id: VF-07b, aspect: "The 4 hint bytes as an identifier of a signer", status: passed_through, verification: executed}
    core_checks:
      - {stage: C2, what: "ed25519: last 4 bytes of the public key. Hash-x: last 4 bytes of the hash. Signed payload: public-key hint XOR payload hint.", code_ref: "src/transactions/SignatureUtils.cpp:38-46, 83-105, 127-136"}
      - {stage: C4, what: "A signature whose hint matches nothing is unused.", code_ref: "src/transactions/SignatureChecker.cpp:172-191"}
    reader_may_assume: "In a transaction that passed C4, each hint matched the signer it verified against."
    reader_must_not_assume: "That a hint identifies a signer, or that it equals the tail of a G key: it is 4 bytes and may be XOR-ed with a payload."
    result_code_when_rejected: [txBAD_AUTH_EXTRA]
    verification: executed
    spot_checked: true
    demonstrated_by: ["cap-0040/tx-authorised-by-signed-payload-signature"]
    demonstration_note: "local-core probe L16: hint 5d11d84a = key tail XOR payload tail"

  - id: VF-08
    field: "DecoratedSignature.signature (opaque<64>)"
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C2, what: "ed25519: verified over the contents hash. Hash-x: sha256(signature) must equal the hash, so the 'signature' is the preimage, 0-64 bytes. Signed payload: ed25519 over the payload bytes.", code_ref: "src/transactions/SignatureUtils.cpp:49-61, 83-91"}
      - {stage: C2, what: "Pre-auth-tx signers consume no signature.", code_ref: "src/transactions/SignatureChecker.cpp:70-85"}
    reader_may_assume: "Each signature in a transaction that passed C4 satisfied one signer."
    reader_must_not_assume: "That a signature is a 64-byte ed25519 signature."
    result_code_when_rejected: [txBAD_AUTH_EXTRA, txBAD_AUTH]
    verification: code_reference
    spot_checked: true
    demonstrated_by: ["classic/hash-x-signer-preimage-0-and-64-bytes"]

  - id: VF-09
    field: FeeBumpTransaction.feeSource
    controlled_by: fee payer
    status: partially_validated
    status_detail: "ed25519 key: validated. Muxed ID: passed through."
    parts:
      - {id: VF-09a, aspect: "The ed25519 key of the fee source", status: validated, verification: executed}
      - {id: VF-09b, aspect: "The muxed ID of the fee source", status: passed_through, verification: executed}
    core_checks:
      - {stage: C1, what: "Account must exist.", code_ref: "src/transactions/FeeBumpTransactionFrame.cpp:456-460"}
      - {stage: C2, what: "Must sign at LOW threshold and afford the fee.", code_ref: "src/transactions/FeeBumpTransactionFrame.cpp:273-285, 476-487, 499-502"}
      - {stage: C1, what: "Muxed ID stripped (getFeeSourceID).", code_ref: "src/transactions/FeeBumpTransactionFrame.cpp:676-678"}
      - {stage: C1, what: "Not covered by the Protocol 25 Soroban muxed-source rule, which inspects inner transaction and operation sources only.", code_ref: "src/transactions/TransactionFrame.cpp:361-365"}
    reader_may_assume: "The fee source key is a real account that paid the fee."
    reader_must_not_assume: "That the fee payer is the inner source, or that its muxed ID means anything."
    result_code_when_rejected: [txNO_ACCOUNT, txBAD_AUTH, txINSUFFICIENT_BALANCE]
    verification: executed
    spot_checked: true
    demonstrated_by: ["cap-0015/fee-bump-muxed-fee-source-inner-failed"]
    demonstration_note: "local-core probe L18: fee source M with ID 7"

  - id: VF-10
    field: FeeBumpTransaction.fee
    controlled_by: fee payer
    status: validated
    status_detail: "Validated as a bid."
    core_checks:
      - {stage: C1, what: "Outer inclusion fee at least the minimum and per-operation rate at least the inner rate. An inner transaction with a negative inclusion fee is accepted only for Soroban from Protocol 23, otherwise txFEE_BUMP_INNER_FAILED.", code_ref: "src/transactions/FeeBumpTransactionFrame.cpp:402-454"}
    reader_may_assume: "The outer fee bid met the minimum."
    reader_must_not_assume: "That the bid was charged. Use the outer feeCharged."
    result_code_when_rejected: [txINSUFFICIENT_FEE, txFEE_BUMP_INNER_FAILED]
    verification: executed
    spot_checked: true
    demonstrated_by:
      - "cap-0015/fee-bump-muxed-fee-source-inner-failed"  # local-core probe L18
      - "cap-0015/fee-bump-inner-failed"  # history, pubnet 34861066, tx 6d448f79…e27f: outer fee 2000, charged 200

  - id: VF-11
    field: "FeeBumpTransactionEnvelope.signatures<20>"
    controlled_by: fee payer
    status: validated
    core_checks:
      - {stage: C4, what: "Separate signature check over the fee-bump hash; all must be used. Inner signatures are checked against the inner hash.", code_ref: "src/transactions/FeeBumpTransactionFrame.cpp:312-347"}
    reader_may_assume: "Outer and inner signatures were each checked against their own hash."
    reader_must_not_assume: ""
    result_code_when_rejected: [txBAD_AUTH_EXTRA]
    verification: code_reference
    spot_checked: true
    demonstrated_by: ["cap-0015/fee-bump-muxed-fee-source-inner-failed"]
    demonstration_note: "local-core probe L18"

  - id: VF-12
    field: "Transaction.fee of the inner transaction of a fee bump"
    controlled_by: inner signer
    status: passed_through
    status_detail: "Not charged. From Protocol 23 it need not even cover resourceFee for Soroban."
    core_checks:
      - {stage: C1, what: "The inner transaction is validated with chargeFee = false; from Protocol 23 its fee need not even cover resourceFee.", code_ref: "src/transactions/FeeBumpTransactionFrame.cpp:344-347; src/transactions/TransactionFrame.cpp:1338-1356"}
      - {stage: A, what: "Only the fee-bump fee is debited, from the fee source. The inner result reports a computed feeCharged before Protocol 25 and 0 from Protocol 25; neither is debited.", code_ref: "src/transactions/FeeBumpTransactionFrame.cpp:721-751"}
    reader_may_assume: ""
    reader_must_not_assume: "That the inner fee was paid. Never add it to fees paid."
    result_code_when_rejected: []
    verification: executed
    spot_checked: true
    demonstrated_by: ["cap-0015/fee-bump-soroban-inner-fee-zero-from-p25"]
    demonstration_note: "history, pubnet 65437014, tx 82ebce4b…8494: inner fee_charged 0"

  - id: VF-13
    field: "Preconditions type PRECOND_V2"
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C1, what: "Not supported before Protocol 19.", code_ref: "src/transactions/TransactionFrame.cpp:1266-1272"}
    reader_may_assume: "PRECOND_V2 occurs only from Protocol 19."
    reader_must_not_assume: ""
    result_code_when_rejected: [txNOT_SUPPORTED]
    verification: executed
    spot_checked: true
    demonstrated_by: ["cap-0040/extra-signer-signed-payload-local"]
    demonstration_note: "local-core probe L17"

  - id: VF-14
    field: "Preconditions.timeBounds (minTime, maxTime)"
    controlled_by: submitter
    status: validated
    status_detail: "Validated against close time. minTime > maxTime is not rejected as malformed; such a transaction is simply never valid."
    parts:
      - {id: VF-14a, aspect: "minTime and maxTime compared with the close time", status: validated, verification: code_reference}
      - {id: VF-14b, aspect: "A transaction landing in a ledger with txTOO_LATE or txTOO_EARLY after CAP-34 (fee charged)", status: undetermined, verification: unverified}
    core_checks:
      - {stage: C1, what: "Checked against close time; maxTime 0 means unbounded.", code_ref: "src/transactions/TransactionFrame.cpp:1148-1195"}
    reader_may_assume: "For txSUCCESS and txFAILED results the bounds held at the apply close time."
    reader_must_not_assume: "That a transaction in a ledger satisfied its bounds: pubnet ledger 30379767 (Protocol 13) holds one with txTOO_LATE, its fee charged and its sequence number unchanged (`cap-0034/tx-too-late-with-fee-charged`), and the code at v30.0.0 still re-checks the bounds at apply."
    result_code_when_rejected: [txTOO_EARLY, txTOO_LATE]
    verification: unverified
    unverified_parts: ["Shown only before CAP-34 (Protocol 14, which pubnet skipped): pubnet ledger 30379767 (Protocol 13) holds a txTOO_LATE result with its fee charged and the sequence number unchanged (`cap-0034/tx-too-late-with-fee-charged`), and the scan of pubnet ledgers 2 to 65,505,999 finds txTOO_LATE results only in ledgers 16,247,791 to 32,567,505, before the upgrade to Protocol 15 at ledger 32,747,293. No txTOO_EARLY result is in the corpus. Whether either can happen after CAP-34 is not established. Only part VF-14b is affected: part VF-14a (the comparison with close time) rests on the code reference and stays in the published table."]
    spot_checked: true
    demonstrated_by: ["cap-0034/tx-too-late-with-fee-charged"]
    demonstration_note: "history, pubnet 30379767 (Protocol 13), tx a11c4fcc…22cb0: max_time 1593508579, close time 1593508580, fee 100 charged, seq_num unchanged"

  - id: VF-15
    field: Preconditions.ledgerBounds
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C1, what: "From Protocol 19: minLedger <= ledgerSeq, and maxLedger is 0 or ledgerSeq < maxLedger.", code_ref: "src/transactions/TransactionFrame.cpp:1162-1166, 1189-1193"}
    reader_may_assume: "As VF-14."
    reader_must_not_assume: "As VF-14."
    result_code_when_rejected: [txTOO_EARLY, txTOO_LATE]
    verification: executed
    spot_checked: true
    demonstrated_by: ["cap-0021/extra-signers-two-signed-payload-keys"]
    demonstration_note: "history, pubnet 65437035, tx 66ba592f…bd11: max_ledger 65437036"

  - id: VF-16
    field: Preconditions.minSeqNum
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C2, what: "Relaxes the sequence-number rule of VF-04.", code_ref: "src/transactions/TransactionFrame.cpp:1596-1600"}
    reader_may_assume: "The account sequence can jump by more than one."
    reader_must_not_assume: "That consecutive transactions of an account have consecutive sequence numbers."
    result_code_when_rejected: [txBAD_SEQ]
    verification: code_reference
    spot_checked: true
    demonstrated_by: ["cap-0021/precond-v2-all-fields"]

  - id: VF-17
    field: "Preconditions.minSeqAge, minSeqLedgerGap"
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: C2, what: "Checked against the source's seqTime and seqLedger.", code_ref: "src/transactions/TransactionFrame.cpp:1198-1238"}
    reader_may_assume: ""
    reader_must_not_assume: ""
    result_code_when_rejected: [txBAD_MIN_SEQ_AGE_OR_GAP]
    verification: code_reference
    spot_checked: true
    demonstrated_by: ["cap-0021/min-seq-age-failure", "cap-0021/precond-v2-all-fields"]

  - id: VF-18
    field: "Preconditions.extraSigners<2>"
    controlled_by: submitter
    status: validated
    core_checks:
      - {stage: D0, what: "At most 2 by XDR.", code_ref: "xdr:Stellar-transaction.x:829"}
      - {stage: C1, what: "Two entries must differ; a signed-payload entry must have a non-empty payload.", code_ref: "src/transactions/TransactionFrame.cpp:1274-1294"}
      - {stage: C2, what: "Each needs a matching signature (Protocol 19+).", code_ref: "src/transactions/TransactionFrame.cpp:458-481, 521-525"}
    reader_may_assume: "Each extra signer really signed."
    reader_must_not_assume: "That extra signers are account signers on the ledger: they are transaction preconditions only."
    result_code_when_rejected: [txMALFORMED, txBAD_AUTH]
    verification: executed
    spot_checked: true
    demonstrated_by:
      - "cap-0040/extra-signer-signed-payload-local"  # local-core probe L17
      - "cap-0021/extra-signers-two-signed-payload-keys"  # history, pubnet 65437035, tx 66ba592f…bd11

  - id: VF-19
    field: "Memo (all arms)"
    controlled_by: submitter
    status: passed_through
    status_detail: "No semantic check. Exception: from Protocol 25 an InvokeHostFunction transaction must have MEMO_NONE."
    core_checks:
      - {stage: D0, what: "MEMO_TEXT is at most 28 bytes by XDR; there is no UTF-8 or printable check. MEMO_ID is any 64-bit value; MEMO_HASH and MEMO_RETURN are any 32 bytes.", code_ref: "xdr:Stellar-transaction.x:773-785"}
