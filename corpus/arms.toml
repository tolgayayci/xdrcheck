reason = "reachable only through LedgerCloseMeta scpInfo, which stellar-core never fills"

[[arm]]
id = "ChangeTrustAsset::ASSET_TYPE_NATIVE"
class = "in-ledger"
reason = "ChangeTrustOpFrame::doCheckValid rejects a native line with CHANGE_TRUST_MALFORMED only from Protocol 10; before that the operation reached apply, which throws (txINTERNAL_ERROR), so pre-Protocol 10 ledgers hold the arm in their envelopes. Pubnet evidence: the locate index of the full pubnet scan (2026-11-18) lists it in ledgers 13012938..19955608, and classic/change-trust-native-line-before-p10 captures ledger 13012938"

[[arm]]
id = "TrustLineAsset::ASSET_TYPE_NATIVE"
class = "validation-only"
evidence = "unverified"
reason = "a native trustline key exists nowhere in ledger state; operations and footprints naming one are rejected while validating"

[[arm]]
id = "LedgerKey::CONFIG_SETTING"
class = "validation-only"
evidence = "unverified"
reason = "the only ledger keys a ledger carries are footprint, eviction and restore keys; a footprint naming a CONFIG_SETTING key is rejected while validating (Soroban footprints may only name contract data, contract code, accounts and trustlines)"

[[arm]]
id = "ClaimPredicate::CLAIM_PREDICATE_NOT?none"
class = "validation-only"
evidence = "unverified"
reason = "CreateClaimableBalanceOpFrame::doCheckValid requires a NOT predicate to hold an inner predicate"

[[arm]]
id = "TransactionMeta::v0"
class = "not-in-lake"
reason = "stellar-core built v0 meta before protocol 10; the public lake's early ledgers were regenerated by core 23 with v4 meta, so the lake no longer holds it (uncovered: needs another source of pre-protocol-10 meta)"

[[arm]]
id = "TransactionMeta::v1"
class = "not-in-lake"
reason = "stellar-core built v1 meta from protocol 10 until protocol 13 (v2 since); the public lake's early ledgers were regenerated with v4 meta and a local core runs protocol 13 or later, so the lake no longer holds it (uncovered)"

[[arm]]
id = "OperationResultTr::CREATE_PASSIVE_SELL_OFFER"
class = "never-built"
evidence = "unverified"
reason = "stellar-core applies a passive offer as a converted MANAGE_SELL_OFFER operation (CreatePassiveSellOfferOpFrame) and sets the result arm from that operation's type, so a CREATE_PASSIVE_SELL_OFFER operation carries a MANAGE_SELL_OFFER result; pubnet and testnet ledgers with the operation show it"
