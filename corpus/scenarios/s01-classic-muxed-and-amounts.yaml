# Classic shapes around muxed accounts, amounts and asset codes: a payment whose transaction
# source, operation source and destination are all muxed with extreme IDs; an issued-asset payment
# of 2^53 + 1 stroops between two holders; payments of an issued asset coded `xlm` and of a
# five-character AlphaNum12 code next to its four-character AlphaNum4 neighbour; an account merge
# into a muxed destination. Protocol 28 serves the reader pins that cannot decode Protocol 30.
#
# The `fund` setup item's ledger is an entry too: one transaction from the network's root account
# creating every actor. The root key derives from the network ID, so its address differs between
# the passphrases and the expectation names it `${acct.root}`.
scenario: classic-muxed-and-amounts
caps: [27, 67]
protocols: [28, 30]
profile: lake
actors: [A, B, I, H1, H2, M]
assets:
  BIG: {credit_alphanum4: {asset_code: BIG, issuer: "${acct.I}"}}
  XLMLC: {credit_alphanum4: {asset_code: xlm, issuer: "${acct.I}"}}
  ABCDE: {credit_alphanum12: {asset_code: ABCDE, issuer: "${acct.I}"}}
  ABCD: {credit_alphanum4: {asset_code: ABCD, issuer: "${acct.I}"}}
setup:
  - fund: {A: "10000", B: "10000", I: "10000", H1: "10000", H2: "10000", M: "100"}
    entry: classic/create-account-funded-from-root
    expect:
      ledger: {transactions: 1, operations: 6, events: 7, entry_changes: 22}
      transactions:
        - {index: 0, hash: "${derived.tx_hash}", successful: true, result_code: tx_success, operation_result_codes: [create_account.success, create_account.success, create_account.success, create_account.success, create_account.success, create_account.success], fee_charged: "600"}
      values:
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/source_account
          equals: "${acct.root}"
          note: "The network root account: its key is derived from the network ID, so the source differs between the testnet and public-passphrase twins while every created account is the same."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics
          equals: [{symbol: transfer}, {address: "${acct.root}"}, {address: "${acct.A}"}, {string: native}]
        - select:
            in: /v2/tx_processing/0/tx_apply_processing/v4/operations/5/changes
            key: {account: {account_id: "${acct.M}"}}
            change: created
          path: /created/data/account/balance
          equals: "1000000000"
      participants:
        must_include:
          - {address: "${acct.root}", roles: [source, fee_payer]}
          - {address: "${acct.A}", roles: [destination]}
          - {address: "${acct.B}", roles: [destination]}
          - {address: "${acct.I}", roles: [destination]}
          - {address: "${acct.H1}", roles: [destination]}
          - {address: "${acct.H2}", roles: [destination]}
          - {address: "${acct.M}", roles: [destination]}
        exact: true
      state_changes:
        - {kind: account_created, op_index: 0, account: {address: "${acct.A}"}, detail: {starting_balance: "100000000000"}}
        - {kind: account_created, op_index: 1, account: {address: "${acct.B}"}, detail: {starting_balance: "100000000000"}}
        - {kind: account_created, op_index: 2, account: {address: "${acct.I}"}, detail: {starting_balance: "100000000000"}}
        - {kind: account_created, op_index: 3, account: {address: "${acct.H1}"}, detail: {starting_balance: "100000000000"}}
        - {kind: account_created, op_index: 4, account: {address: "${acct.H2}"}, detail: {starting_balance: "100000000000"}}
        - {kind: account_created, op_index: 5, account: {address: "${acct.M}"}, detail: {starting_balance: "1000000000"}}
      state_changes_exact: true
      movements:
        - {kind: fee, asset: native, amount: "600", from: {address: "${acct.root}"}}
        - {kind: transfer, op_index: 0, asset: native, amount: "100000000000", from: {address: "${acct.root}"}, to: {address: "${acct.A}"}, routing: {type: absent}}
        - {kind: transfer, op_index: 1, asset: native, amount: "100000000000", from: {address: "${acct.root}"}, to: {address: "${acct.B}"}, routing: {type: absent}}
        - {kind: transfer, op_index: 2, asset: native, amount: "100000000000", from: {address: "${acct.root}"}, to: {address: "${acct.I}"}, routing: {type: absent}}
        - {kind: transfer, op_index: 3, asset: native, amount: "100000000000", from: {address: "${acct.root}"}, to: {address: "${acct.H1}"}, routing: {type: absent}}
        - {kind: transfer, op_index: 4, asset: native, amount: "100000000000", from: {address: "${acct.root}"}, to: {address: "${acct.H2}"}, routing: {type: absent}}
        - {kind: transfer, op_index: 5, asset: native, amount: "1000000000", from: {address: "${acct.root}"}, to: {address: "${acct.M}"}, routing: {type: absent}}
      movements_exact: true
  - trust: {H1: [BIG, XLMLC, ABCDE, ABCD], H2: [BIG, XLMLC, ABCDE, ABCD]}
  # 2 × (2^53 + 1) stroops, so that after the step both holders hold exactly 2^53 + 1.
  - pay: {from: I, to: H1, asset: BIG, amount: "1801439850.9481986"}
  - pay: {from: I, to: H1, asset: XLMLC, amount: "100"}
  - pay: {from: I, to: H1, asset: ABCDE, amount: "100"}
  - pay: {from: I, to: H1, asset: ABCD, amount: "100"}

steps:
  - id: muxed-source-and-destination
    entry: cap-0027/muxed-source-and-destination-max-ids
    tx:
      source_account: "${muxed(A, 18446744073709551615)}"
      fee: 1000
      seq_num: "${seq.A}"
      cond: {time: {min_time: "0", max_time: "0"}}
      memo: none
      operations:
        - source_account: "${muxed(A, 9223372036854775808)}"
          body: {payment: {destination: "${muxed(B, 9007199254740993)}", asset: native, amount: "100000000"}}
      ext: v0
    sign: [{key: A}]
    expect_result: tx_success
    expect_op_results: [payment.success]
    expect:
      ledger: {transactions: 1, operations: 1, events: 2, entry_changes: 8}
      transactions:
        - {index: 0, hash: "${derived.tx_hash}", successful: true, result_code: tx_success, operation_result_codes: [payment.success], fee_charged: "${derived.fee_charged}"}
      values:
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/source_account
          equals: "${muxed(A, 18446744073709551615)}"
          note: "Transaction source muxed with ID 2^64 - 1, which does not fit a signed 64-bit integer."
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/0/source_account
          equals: "${muxed(A, 9223372036854775808)}"
          note: "The operation source is the same account muxed with another ID, 2^63."
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/0/body/payment/destination
          equals: "${muxed(B, 9007199254740993)}"
          note: "Destination ID 2^53 + 1, which a float64 cannot hold."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes/0/state/data/account/account_id
          equals: "${acct.A}"
          note: "Ledger entries are keyed by the base G account; the muxed IDs appear nowhere in the entry changes."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes/3/updated/data/account/account_id
          equals: "${acct.B}"
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics/1
          equals: {address: "${acct.A}"}
          note: "Event topics carry the addresses with the muxed information dropped."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics/2
          equals: {address: "${acct.B}"}
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/data/map/1
          equals: {key: {symbol: to_muxed_id}, val: {u64: "9007199254740993"}}
          note: "The destination's muxed ID moves into the event data as an exact u64."
      participants:
        must_include:
          - {address: "${acct.A}", roles: [source, fee_payer]}
          - {address: "${acct.B}", muxed_id: "9007199254740993", on_chain_form: "${muxed(B, 9007199254740993)}", roles: [destination]}
        exact: true
      movements:
        - {kind: fee, asset: native, amount: "${derived.fee_charged}", from: {address: "${acct.A}"}}
        - kind: transfer
          op_index: 0
          asset: native
          amount: "100000000"
          from: {address: "${acct.A}"}
          to: {address: "${acct.B}", muxed_id: "9007199254740993"}
          routing: {type: u64, value: "9007199254740993"}
      movements_exact: true
      # The operation source's M form (ID 2^63) is not listed: it lives only in the envelope, no
      # observation kind stores an operation's source, and a reader that keeps one muxed alias per
      # account rightly keeps the transaction source's. The value pinpoint above pins it.
      addresses:
        - {strkey: "${muxed(A, 18446744073709551615)}", type: muxed_account, xdr_bytes: 44, chars: 69}
        - {strkey: "${muxed(B, 9007199254740993)}", type: muxed_account, xdr_bytes: 44, chars: 69}
    fields:
      validated: [VF-02a, VF-22a, VF-24a]
      passed_through: [VF-02b, VF-22b, VF-24b, VF-20, VF-21]

  - id: amount-above-2-pow-53
    entry: classic/amount-above-2-pow-53-stroops
    tx:
      source_account: "${acct.H1}"
      fee: 1000
      seq_num: "${seq.H1}"
      cond: {time: {min_time: "0", max_time: "0"}}
      memo: none
      operations:
        - source_account: null
          body: {payment: {destination: "${acct.H2}", asset: "${asset.BIG}", amount: "9007199254740993"}}
      ext: v0
    sign: [{key: H1}]
    expect_result: tx_success
    expect_op_results: [payment.success]
    expect:
      ledger: {transactions: 1, operations: 1, events: 2, entry_changes: 8}
      transactions:
        - {index: 0, hash: "${derived.tx_hash}", successful: true, result_code: tx_success, operation_result_codes: [payment.success], fee_charged: "${derived.fee_charged}"}
      values:
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/0/body/payment/amount
          equals: "9007199254740993"
          note: "2^53 + 1 stroops: the smallest positive integer a float64 cannot represent."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes/1/updated/data/trustline/balance
          equals: "9007199254740993"
          note: "The sender's balance after the payment (it held twice the amount)."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes/3/updated/data/trustline/balance
          equals: "9007199254740993"
          note: "The receiver's balance after the payment."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/data
          equals: {i128: "9007199254740993"}
      participants:
        must_include:
          - {address: "${acct.H1}", roles: [source, fee_payer, trustline_owner]}
          - {address: "${acct.H2}", roles: [trustline_owner]}
        must_not_include:
          - {address: "${acct.I}", because: "I only issues the asset; no ledger entry of I changed"}
      movements:
        - {kind: fee, asset: native, amount: "${derived.fee_charged}", from: {address: "${acct.H1}"}}
        - {kind: transfer, op_index: 0, asset: "BIG:${acct.I}", amount: "9007199254740993", from: {address: "${acct.H1}"}, to: {address: "${acct.H2}"}, routing: {type: absent}}
      movements_exact: true
    fields: {validated: [VF-24a]}

  - id: asset-code-xlm
    entry: classic/asset-issued-with-code-xlm
    tx:
      source_account: "${acct.H1}"
      fee: 1000
      seq_num: "${seq.H1}"
      cond: {time: {min_time: "0", max_time: "0"}}
      memo: none
      operations:
        - source_account: null
          body: {payment: {destination: "${acct.H2}", asset: "${asset.XLMLC}", amount: "100000000"}}
      ext: v0
    sign: [{key: H1}]
    expect_result: tx_success
    expect_op_results: [payment.success]
    expect:
      ledger: {transactions: 1, operations: 1, events: 2, entry_changes: 8}
      transactions:
        - {index: 0, hash: "${derived.tx_hash}", successful: true, result_code: tx_success, operation_result_codes: [payment.success], fee_charged: "${derived.fee_charged}"}
      values:
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/0/body/payment/asset
          equals: {credit_alphanum4: {asset_code: xlm, issuer: "${acct.I}"}}
          note: "An issued AlphaNum4 asset coded `xlm` (bytes 78 6c 6d 00), not the native asset."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes/1/updated/data/trustline/asset
          equals: {credit_alphanum4: {asset_code: xlm, issuer: "${acct.I}"}}
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics/3
          equals: {string: "xlm:${acct.I}"}
          note: "The classic event names the asset as CODE:ISSUER; the native asset would be the string `native`."
      participants:
        must_include:
          - {address: "${acct.H1}", roles: [source, fee_payer, trustline_owner]}
          - {address: "${acct.H2}", roles: [trustline_owner]}
        must_not_include:
          - {address: "${acct.I}", because: "I only issues the asset; no ledger entry of I changed"}
      movements:
        - {kind: fee, asset: native, amount: "${derived.fee_charged}", from: {address: "${acct.H1}"}}
        - {kind: transfer, op_index: 0, asset: "xlm:${acct.I}", amount: "100000000", from: {address: "${acct.H1}"}, to: {address: "${acct.H2}"}, routing: {type: absent}}
      movements_exact: true
    fields: {validated: [VF-24a, VF-26]}

  - id: asset-code12-five-characters
    entry: classic/asset-code12-with-five-characters
    tx:
      source_account: "${acct.H1}"
      fee: 1000
      seq_num: "${seq.H1}"
      cond: {time: {min_time: "0", max_time: "0"}}
      memo: none
      operations:
        - source_account: null
          body: {payment: {destination: "${acct.H2}", asset: "${asset.ABCDE}", amount: "100000000"}}
        - source_account: null
          body: {payment: {destination: "${acct.H2}", asset: "${asset.ABCD}", amount: "100000000"}}
      ext: v0
    sign: [{key: H1}]
    expect_result: tx_success
    expect_op_results: [payment.success, payment.success]
    expect:
      ledger: {transactions: 1, operations: 2, events: 3, entry_changes: 12}
      transactions:
        - {index: 0, hash: "${derived.tx_hash}", successful: true, result_code: tx_success, operation_result_codes: [payment.success, payment.success], fee_charged: "${derived.fee_charged}"}
      values:
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/0/body/payment/asset
          equals: {credit_alphanum12: {asset_code: ABCDE, issuer: "${acct.I}"}}
          note: "Five characters in an AlphaNum12 code: the twelve bytes are 41 42 43 44 45 and seven NULs."
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/1/body/payment/asset
          equals: {credit_alphanum4: {asset_code: ABCD, issuer: "${acct.I}"}}
          note: "A different asset of the same issuer, whose code is the first four characters."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics/3
          equals: {string: "ABCDE:${acct.I}"}
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/1/events/0/body/v0/topics/3
          equals: {string: "ABCD:${acct.I}"}
      participants:
        must_include:
          - {address: "${acct.H1}", roles: [source, fee_payer, trustline_owner]}
          - {address: "${acct.H2}", roles: [trustline_owner]}
        must_not_include:
          - {address: "${acct.I}", because: "I only issues the assets; no ledger entry of I changed"}
      movements:
        - {kind: fee, asset: native, amount: "${derived.fee_charged}", from: {address: "${acct.H1}"}}
        - {kind: transfer, op_index: 0, asset: "ABCDE:${acct.I}", amount: "100000000", from: {address: "${acct.H1}"}, to: {address: "${acct.H2}"}, routing: {type: absent}}
        - {kind: transfer, op_index: 1, asset: "ABCD:${acct.I}", amount: "100000000", from: {address: "${acct.H1}"}, to: {address: "${acct.H2}"}, routing: {type: absent}}
      movements_exact: true
    fields: {validated: [VF-24a, VF-26]}

  - id: account-merge-to-muxed
    entry: cap-0027/account-merge-to-muxed-destination
    tx:
      source_account: "${acct.M}"
      fee: 1000
      seq_num: "${seq.M}"
      cond: {time: {min_time: "0", max_time: "0"}}
      memo: none
      operations:
        - source_account: null
          body: {account_merge: "${muxed(B, 42)}"}
      ext: v0
    sign: [{key: M}]
    expect_result: tx_success
    expect_op_results: [account_merge.success]
    expect:
      ledger: {transactions: 1, operations: 1, events: 2, entry_changes: 8}
      transactions:
        - {index: 0, hash: "${derived.tx_hash}", successful: true, result_code: tx_success, operation_result_codes: [account_merge.success], fee_charged: "${derived.fee_charged}"}
      values:
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/0/body/account_merge
          equals: "${muxed(B, 42)}"
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes/1/removed
          equals: {account: {account_id: "${acct.M}"}}
          note: "The merged account is removed."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes/3/updated/data/account/account_id
          equals: "${acct.B}"
          note: "The destination is credited under its base account."
        - path: /v2/tx_processing/0/result/result/result/tx_success/0/op_inner/account_merge/success
          equals: "999999900"
          note: "The amount moved: M's 100 XLM less the fee."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/data/map/1
          equals: {key: {symbol: to_muxed_id}, val: {u64: "42"}}
      participants:
        must_include:
          - {address: "${acct.M}", roles: [source, fee_payer]}
          - {address: "${acct.B}", muxed_id: "42", on_chain_form: "${muxed(B, 42)}", roles: [destination]}
        exact: true
      state_changes:
        - kind: account_removed
          op_index: 0
          account: {address: "${acct.M}"}
          detail: {merged_into: "${acct.B}", balance_transferred: "999999900"}
      state_changes_exact: true
      movements:
        - {kind: fee, asset: native, amount: "${derived.fee_charged}", from: {address: "${acct.M}"}}
        - {kind: transfer, op_index: 0, asset: native, amount: "999999900", from: {address: "${acct.M}"}, to: {address: "${acct.B}", muxed_id: "42"}, routing: {type: u64, value: "42"}}
      movements_exact: true
      addresses:
        - {strkey: "${muxed(B, 42)}", type: muxed_account, xdr_bytes: 44, chars: 69}
    fields:
      validated: [VF-37a]
      passed_through: [VF-37b, VF-20, VF-21]
