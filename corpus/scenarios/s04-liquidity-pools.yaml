          - {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH", roles: [liquidity_pool]}
        exact: true
      state_changes:
        - kind: liquidity_pool_changed
          op_index: 0
          account: {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"}
