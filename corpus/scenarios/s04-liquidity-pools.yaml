  - id: first-deposit
    entry: cap-0038/pool-deposit-use-count-on-asset-trustlines
    tx:
      source_account: "${acct.H}"
      fee: 1000
      seq_num: "${seq.H}"
      cond: none
      memo: none
      operations:
        - source_account: null
          body: {liquidity_pool_deposit: {liquidity_pool_id: LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH, max_amount_a: "100000000", max_amount_b: "100000000", min_price: {n: 1, d: 2}, max_price: {n: 2, d: 1}}}
      ext: v0
    sign: [{key: H}]
    expect_result: tx_success
    expect_op_results: [liquidity_pool_deposit.success]
    expect:
      ledger: {transactions: 1, operations: 1, events: 3, entry_changes: 12}
      transactions:
        - {index: 0, hash: "${derived.tx_hash}", successful: true, result_code: tx_success, operation_result_codes: [liquidity_pool_deposit.success], fee_charged: "${derived.fee_charged}"}
      values:
        - path: /v2/tx_set/v1/phases/0/v0/0/txset_comp_txs_maybe_discounted_fee/txs/0/tx/tx/operations/0/body/liquidity_pool_deposit/liquidity_pool_id
          equals: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"
          note: "sha256 of the pool parameters (X:I1, Y:I2, fee 30), computed before the run."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics
          equals: [{symbol: transfer}, {address: "${acct.H}"}, {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"}, {string: "X:${acct.I1}"}]
          note: "The deposit is reported as a transfer to the pool's L address."
        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/1/body/v0/topics
          equals: [{symbol: transfer}, {address: "${acct.H}"}, {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"}, {string: "Y:${acct.I2}"}]
      participants:
        must_include:
          - {address: "${acct.H}", roles: [source, fee_payer, trustline_owner]}
          - {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH", roles: [liquidity_pool]}
        must_not_include:
          - {address: "${acct.I1}", because: "I1 only issues X; no ledger entry of I1 changed"}
          - {address: "${acct.I2}", because: "I2 only issues Y; no ledger entry of I2 changed"}
        exact: true
      state_changes:
        - kind: liquidity_pool_changed
          op_index: 0
          account: {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"}
          detail: {pool_id: "10eb04b4ae006ea96b392a3d18cb5bc66333f640216c4f8f19a7cfbaa7e78e85", pool_strkey: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH", asset_a: "X:${acct.I1}", asset_b: "Y:${acct.I2}", fee_bp: 30, reserve_a: "100000000", reserve_b: "100000000", total_shares: "100000000", pool_shares_trust_line_count: "1"}
        - kind: balance_changed
          op_index: 0
          account: {address: "${acct.H}"}
          asset: "liquidity_pool:10eb04b4ae006ea96b392a3d18cb5bc66333f640216c4f8f19a7cfbaa7e78e85"
          detail: {delta: "100000000", balance_after: "100000000"}
      state_changes_exact: true
      movements:
        - {kind: fee, asset: native, amount: "${derived.fee_charged}", from: {address: "${acct.H}"}}
        - {kind: transfer, op_index: 0, asset: "X:${acct.I1}", amount: "100000000", from: {address: "${acct.H}"}, to: {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"}, routing: {type: absent}}
        - {kind: transfer, op_index: 0, asset: "Y:${acct.I2}", amount: "100000000", from: {address: "${acct.H}"}, to: {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"}, routing: {type: absent}}
      movements_exact: true
      addresses:
        - {strkey: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH", type: liquidity_pool, xdr_bytes: 32, chars: 56}
    fields: {validated: [VF-40]}

