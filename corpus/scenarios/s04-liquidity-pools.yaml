        must_not_include:
          - {address: "${acct.PI3}", because: "PI3 only issues asset A; no ledger entry of PI3 changed"}
          - {address: "${acct.PI9}", because: "PI9 only issues asset B; no ledger entry of PI9 changed"}
        exact: true
      state_changes:
        - kind: trustline_created
          op_index: 0
          account: {address: "${acct.PT}"}
          asset: "liquidity_pool:41ca328897f7273543665a0c61d241fad41591ac8951bbf8858ccacf52a4257e"
          detail: {pool_strkey: "LBA4UMUIS73SONKDMZNAYYOSIH5NIFMRVSEVDO7YQWGMVT2SUQSX4YVT"}
        - kind: trustline_flags_changed
          only_if: initial_authorization_separate
          op_index: 0
          account: {address: "${acct.PT}"}
          asset: "liquidity_pool:41ca328897f7273543665a0c61d241fad41591ac8951bbf8858ccacf52a4257e"
        - kind: liquidity_pool_created
          op_index: 0
          account: {address: "LBA4UMUIS73SONKDMZNAYYOSIH5NIFMRVSEVDO7YQWGMVT2SUQSX4YVT"}
          detail: {asset_a: "USD:${acct.PI3}", asset_b: "USD:${acct.PI9}", fee_bp: 30, asset_a_issuer_key_hex: "70ca71d55d244496c1ccda341fe404f377fc87bb0da6774ae9f7261cfed368cc", asset_b_issuer_key_hex: "7989ebe5e53b6843c78ea2d4616db30daea310dec44a19a0616e11c162fc19d3", pool_id: "41ca328897f7273543665a0c61d241fad41591ac8951bbf8858ccacf52a4257e"}
      state_changes_exact: true
      movements:
        - {kind: fee, asset: native, amount: "100", from: {address: "${acct.PT}"}}
      movements_exact: true
      addresses:
        - {strkey: "LBA4UMUIS73SONKDMZNAYYOSIH5NIFMRVSEVDO7YQWGMVT2SUQSX4YVT", type: liquidity_pool, xdr_bytes: 32, chars: 56}
