          equals: {asset_a: {credit_alphanum4: {asset_code: USD, issuer: "${acct.PI3}"}}, asset_b: {credit_alphanum4: {asset_code: USD, issuer: "${acct.PI9}"}}, fee: 30}
          note: "Asset A's issuer has the lower raw key (70ca71d5… < 7989ebe5…), so stellar-core accepts this order; its strkey GBYM… sorts after GB4Y… ('Y' 0x59 > '4' 0x34 at the third character), so a reader that orders by strkey rejects the operation."
        - select:
            in: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes
            key: {liquidity_pool: {liquidity_pool_id: LBA4UMUIS73SONKDMZNAYYOSIH5NIFMRVSEVDO7YQWGMVT2SUQSX4YVT}}
            change: created
          path: /created/data/liquidity_pool/body/liquidity_pool_constant_product/params
          equals: {asset_a: {credit_alphanum4: {asset_code: USD, issuer: "${acct.PI3}"}}, asset_b: {credit_alphanum4: {asset_code: USD, issuer: "${acct.PI9}"}}, fee: 30}
          note: "The pool is created with the assets in the same raw-key order."
