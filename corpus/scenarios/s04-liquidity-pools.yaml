# CAP-0038 liquidity pools, classic only: the first deposit into a pool (the asset trustlines
# already count the pool-share trustline in liquidityPoolUseCount); a limit-only change of a
# pool-share trustline; withdrawing everything and removing the pool-share trustline, which removes
# the pool; a pool-share trustline held by the issuer of one of the pool's assets; an authorization
# revocation that redeems pool shares into claimable balances; classic events whose addresses are a
# pool and a claimable balance; a path payment whose pool hop comes after 1000 crossed offers
# (Protocol 29 and later only). Protocol 28 serves the reader pins that cannot decode Protocol 30.
#
# Pool IDs are sha256 of the LiquidityPoolParameters (assets in XDR order, fee 30), which no
# passphrase enters; they are written as literals below:
#   X:I1 / Y:I2    10eb04b4ae006ea96b392a3d18cb5bc66333f640216c4f8f19a7cfbaa7e78e85
#   native / X:I1  dab87934e48eeff16d46bf3fc96b9bccbcbc04f1ddf3eb0937ee24981104c32a
#   R:I3 / Y:I2    16c943ea5f70758583260bf0e3fc4caf03accebebb0fc5e8433f9984c2c5a8fd
#   native / Y:I2  cde8471e3d30eedab980644c0a3ed7820bb9c2d9940539c44c86b6fcd2bded1c
#   OB:I5 / OC:I5  0cae09cd0db88bdb9aca9a1cd8b55b443ba25047d62cc0e1b3a2d3621037a7cf
# H4, funded in ledger 13, sends its first transaction with sequence 55834574849; its operation 1
# creates the balance BAACMHKDXNSLWENCF4NBNYJ54VFRPRXOUX7XELLDYNUF5CLG5XYEAXTIW4, which its
# operation 2 claims.
#
# Local twins of cap-0038/pool-issuers-order-by-bytes-not-strkey: the issuers are labelled PI3 and PI9
# because their raw keys and their strkeys sort in opposite orders (PI3's key 70ca71d5… is below
# PI9's 7989ebe5…, while GBYM… sorts after GB4Y…), and the pool's assets are USD of each, in raw-key
# order. Its pool ID, from the same rule as above:
#   USD:PI3 / USD:PI9  41ca328897f7273543665a0c61d241fad41591ac8951bbf8858ccacf52a4257e
scenario: liquidity-pools
caps: [38]
protocols: [28, 30]
profile: lake
actors: [I1, I2, I3, I5, H, H3, H4, C, LPP, MM1, MM2, S, SD, PI3, PI9, PT]
assets:
  X: {credit_alphanum4: {asset_code: X, issuer: "${acct.I1}"}}
  Y: {credit_alphanum4: {asset_code: Y, issuer: "${acct.I2}"}}
  R: {credit_alphanum4: {asset_code: R, issuer: "${acct.I3}"}}
  OA: {credit_alphanum4: {asset_code: OA, issuer: "${acct.I5}"}}
  OB: {credit_alphanum4: {asset_code: OB, issuer: "${acct.I5}"}}
  OC: {credit_alphanum4: {asset_code: OC, issuer: "${acct.I5}"}}
  USD3: {credit_alphanum4: {asset_code: USD, issuer: "${acct.PI3}"}}
  USD9: {credit_alphanum4: {asset_code: USD, issuer: "${acct.PI9}"}}
setup:
  - fund: {I1: "1000", I2: "1000", I3: "1000", I5: "1000", H: "1000", H3: "1000", H4: "1000", C: "100", LPP: "1000", MM1: "1000", MM2: "1000", S: "1000", SD: "100", PI3: "100", PI9: "100", PT: "100"}
  # R is revocable, so I3 can take back H3's authorization.
  - tx:
      source_account: "${acct.I3}"
      fee: 500
      seq_num: "${seq.I3}"
      cond: none
      memo: none
      operations:
        - source_account: null
          body:
            set_options: {inflation_dest: null, clear_flags: null, set_flags: 2, master_weight: null, low_threshold: null, med_threshold: null, high_threshold: null, home_domain: null, signer: null}
      ext: v0
  - trust: {H: [X, Y], H3: [R, Y], H4: Y, LPP: [OB, OC], MM1: [OA, OB], MM2: [OA, OB], S: OA, SD: OC}
  - tx:
      source_account: "${acct.I1}"
      fee: 5000
      seq_num: "${seq.I1}"
      cond: none
      memo: none
      operations:
        - {source_account: null, body: {payment: {destination: "${acct.H}", asset: "${asset.X}", amount: "10000000000"}}}
        - {source_account: "${acct.I2}", body: {payment: {destination: "${acct.H}", asset: "${asset.Y}", amount: "10000000000"}}}
        - {source_account: "${acct.I2}", body: {payment: {destination: "${acct.H3}", asset: "${asset.Y}", amount: "10000000000"}}}
        - {source_account: "${acct.I2}", body: {payment: {destination: "${acct.H4}", asset: "${asset.Y}", amount: "10000000000"}}}
        - {source_account: "${acct.I3}", body: {payment: {destination: "${acct.H3}", asset: "${asset.R}", amount: "10000000000"}}}
        - {source_account: "${acct.I5}", body: {payment: {destination: "${acct.LPP}", asset: "${asset.OB}", amount: "10000000000"}}}
        - {source_account: "${acct.I5}", body: {payment: {destination: "${acct.LPP}", asset: "${asset.OC}", amount: "10000000000"}}}
        - {source_account: "${acct.I5}", body: {payment: {destination: "${acct.MM1}", asset: "${asset.OB}", amount: "500"}}}
        - {source_account: "${acct.I5}", body: {payment: {destination: "${acct.MM2}", asset: "${asset.OB}", amount: "500"}}}
        - {source_account: "${acct.I5}", body: {payment: {destination: "${acct.S}", asset: "${asset.OA}", amount: "10000000000"}}}
      ext: v0
  # Pool-share trustlines of H, H3, H4 and LPP; H3 and LPP deposit.
  - tx:
      source_account: "${acct.H}"
      fee: 5000
      seq_num: "${seq.H}"
      cond: none
      memo: none
      operations:
        - source_account: null
          body: {change_trust: {line: {pool_share: {liquidity_pool_constant_product: {asset_a: "${asset.X}", asset_b: "${asset.Y}", fee: 30}}}, limit: "9223372036854775807"}}
        - source_account: "${acct.H3}"
          body: {change_trust: {line: {pool_share: {liquidity_pool_constant_product: {asset_a: "${asset.R}", asset_b: "${asset.Y}", fee: 30}}}, limit: "9223372036854775807"}}
        - source_account: "${acct.H3}"
          body: {liquidity_pool_deposit: {liquidity_pool_id: LALMSQ7KL5YHLBMDEYF7BY74JSXQHLGOX25Q7RPIIM7ZTBGCYWUP3K3D, max_amount_a: "100000000", max_amount_b: "100000000", min_price: {n: 1, d: 2}, max_price: {n: 2, d: 1}}}
