        - source_account: "${acct.LPP}"
          body: {change_trust: {line: {pool_share: {liquidity_pool_constant_product: {asset_a: "${asset.OB}", asset_b: "${asset.OC}", fee: 30}}}, limit: "9223372036854775807"}}
