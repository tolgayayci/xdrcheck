        - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics
          equals: [{symbol: transfer}, {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH"}, {address: "${acct.H}"}, {string: "X:${acct.I1}"}]
      participants:
