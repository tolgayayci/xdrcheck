          note: "The operation changes the pool-share trustline's limit and nothing else: one state/updated pair, no liquidity-pool entry in the change list."
      participants:
        must_include:
          - {address: "${acct.H}", roles: [source, fee_payer, trustline_owner]}
        must_not_include:
          - {address: "LAIOWBFUVYAG5KLLHEVD2GGLLPDGGM7WIAQWYT4PDGT47OVH46HIKFHH", because: "the pool entry did not change; only H's trustline to its shares did"}
        exact: true
      state_changes:
        - kind: trustline_limit_changed
          op_index: 0
          account: {address: "${acct.H}"}
          asset: "liquidity_pool:10eb04b4ae006ea96b392a3d18cb5bc66333f640216c4f8f19a7cfbaa7e78e85"
          detail: {limit: "1000000000", limit_before: "9223372036854775807"}
      state_changes_exact: true
      movements:
        - {kind: fee, asset: native, amount: "${derived.fee_charged}", from: {address: "${acct.H}"}}
      movements_exact: true
    fields: {validated: [VF-32]}

