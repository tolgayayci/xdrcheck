  # The local twins of the testnet ledger: the ChangeTrust to the pool share of USD of PI3 and USD of
  # PI9, assets in raw-key order (PT's trustlines to the two assets are set up a ledger earlier).
  - id: pool-issuers-in-key-order
    entry: cap-0038/pool-issuers-order-by-bytes-not-strkey-local-twins
    tx:
      source_account: "${acct.PT}"
      fee: 1000
      seq_num: "${seq.PT}"
      cond: none
      memo: none
      operations:
        - source_account: null
          body: {change_trust: {line: {pool_share: {liquidity_pool_constant_product: {asset_a: "${asset.USD3}", asset_b: "${asset.USD9}", fee: 30}}}, limit: "9223372036854775807"}}
      ext: v0
    sign: [{key: PT}]
    expect_result: tx_success
    expect_op_results: [change_trust.success]
    expect:
      ledger: {transactions: 1, operations: 1, events: 1, entry_changes: 12}
