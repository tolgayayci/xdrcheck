  # Three transactions in one ledger (one per source account), each emitting one SEP-41 event
  # whose data is a map with symbol keys: `burn` with `{amount}`, `approve` with
  # `{amount, live_until_ledger}` and `clawback` with `{amount}`. core orders a ledger's Soroban
  # transactions by hash, so the burn's lower time bound is the `${order_nonce}` the generator
  # searches until every chain applies burn, approve, clawback.
  - id: sep41-burn-map
    entry: cap-0067/sep41-map-form-burn-approve-events
    order: [sep41-burn-map, sep41-approve-map, sep41-clawback-map]
    tx:
      source_account: "${acct.A}"
      fee: 1000
      seq_num: "${seq.A}"
      cond: {time: {min_time: "${order_nonce}", max_time: "0"}}
      memo: none
      operations:
        - source_account: null
          body:
            invoke_host_function:
              host_function:
                invoke_contract:
                  contract_address: "${contract.id(emitter)}"
                  function_name: burn
                  args: [{address: "${acct.A}"}, {i128: "304"}, {bool: true}]
    simulate: true
    sign: [{key: A}]
    expect_result: tx_success
    expect_op_results: [invoke_host_function.success]
    expect:
      ledger:
        transactions: 3
        operations: 3
        events: 9
        entry_changes: 18
      transactions:
      - index: 0
        hash: ${derived.tx_hash}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
        fee_charged: ${derived.fee_charged}
      - index: 1
        hash: ${derived.tx_hashes.1}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
      - index: 2
        hash: ${derived.tx_hashes.2}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
      values:
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/contract_id
        equals: ${derived.contracts.emitter}
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0
        equals:
          topics:
          - symbol: burn
          - address: ${acct.A}
          data:
            map:
            - key:
                symbol: amount
              val:
                i128: '304'
        note: SEP-41 burn with map data {amount} (applied first on every chain).
      - path: /v2/tx_processing/1/tx_apply_processing/v4/operations/0/events/0/contract_id
        equals: ${derived.contracts.emitter}
