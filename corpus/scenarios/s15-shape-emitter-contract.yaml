# The shape-emitter test contract (contracts/shape-emitter) puts rare but valid shapes into ledger
# meta on both passphrases: event data nested 99 vectors deep, a map whose keys collide after
# native conversion, a `transfer` event shaped like a Stellar Asset Contract event from a contract
# that is not that asset's contract, events with 0 and 4 topics, custom-token events with
# non-conforming `to_muxed_id` values, SEP-41 map-form `burn`, `approve` and `clawback` events, large
# byte arguments, a second instance created with CREATE_CONTRACT_V2 and constructor arguments, and
# a wasm upload. Contract calls are simulated with the pinned host, so the file runs at Protocols
# 29 and 30 only (the generator deploys custom contracts from Protocol 29).
#
# Every event here comes from the emitter contract, so no event moves value: the custom-token and
# forged events are claims by a contract that holds no balances, and the named classic asset USD
# moves nowhere (its own contract is deployed and untouched).
scenario: shape-emitter-contract
caps: [46, 54, 58, 67, 87]
protocols: [29, 30]
profile: lake
actors: [A, B, C, I, MARK, VICTIM]     # MARK and VICTIM are never funded: they appear only in events
assets:
  USD: {credit_alphanum4: {asset_code: USD, issuer: "${acct.I}"}}
contracts:
  emitter:
    wasm: contracts/shape-emitter.wasm
    wasm_sha256: b53305d9913b679f137ae4d44f1ea2d32f57502f1b12aaa26406168ef4daaed8
    deployer: A
    constructor_args: [{symbol: xcc}]
  # Created by the step `create-contract-v2` (not by a setup item), from A with the salt
  # sha256("xcc/contract-salt/twin"), so `${contract.id(twin)}` names it.
  twin:
    wasm: contracts/shape-emitter.wasm
    wasm_sha256: b53305d9913b679f137ae4d44f1ea2d32f57502f1b12aaa26406168ef4daaed8
    deployer: A
setup:
  - fund: {A: "10000", B: "10000", C: "10000", I: "10000"}
  - deploy_sac: USD
  - deploy_contract: emitter

steps:
  - id: nested-vec-99
    entry: cap-0046/scval-nested-vec-99-in-event
    tx:
      source_account: "${acct.B}"
      fee: 1000
      seq_num: "${seq.B}"
      cond: none
      memo: none
      operations:
        - source_account: null
          body:
            invoke_host_function:
              host_function:
                invoke_contract: {contract_address: "${contract.id(emitter)}", function_name: nested_vec, args: [{u32: 99}]}
    simulate: true
    sign: [{key: B}]
    expect_result: tx_success
    expect_op_results: [invoke_host_function.success]
    expect:
      ledger:
        transactions: 1
        operations: 1
        events: 3
        entry_changes: 6
      transactions:
      - index: 0
        hash: ${derived.tx_hash}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
        fee_charged: ${derived.fee_charged}
      values:
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0/topics
        equals:
        - symbol: nested
      - path: /v2/tx_processing/0/tx_apply_
        equals:
        - void
        note: 'Event data nested 99 vectors deep around Void: the host maximum. nested_vec(100) fails in the
          host (simulation: Error(Context, ExceededLimit)), measured on this scenario at Protocol 30.'
      - path: /v2/tx_processing/0/tx_apply_processing/v4/soroban_meta/return_
        equals:
        - void
        note: The return value is the same 99-level vector.
      participants:
        must_include:
        - address: ${acct.B}
          roles:
          - source
          - fee_payer
        exact: true
      state_changes: []
      state_changes_exact: true
      movements: []
      movements_exact: true
    fields: {validated: [VF-46a, VF-53a], passed_through: [VF-53b]}

  - id: colliding-keys
    entry: cap-0046/event-data-map-with-colliding-keys
    tx:
      source_account: "${acct.B}"
      fee: 1000
      seq_num: "${seq.B}"
      cond: none
      memo: none
      operations:
        - source_account: null
          body:
            invoke_host_function:
              host_function:
                invoke_contract: {contract_address: "${contract.id(emitter)}", function_name: colliding_keys, args: []}
    simulate: true
    sign: [{key: B}]
    expect_result: tx_success
    expect_op_results: [invoke_host_function.success]
    expect:
      ledger:
        transactions: 1
        operations: 1
        events: 4
        entry_changes: 6
      transactions:
      - index: 0
        hash: ${derived.tx_hash}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
        fee_charged: ${derived.fee_charged}
      values:
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/contract_id
        equals: ${derived.contracts.emitter}
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0
        equals:
          topics:
          - symbol: colliding
          data:
            map:
            - key:
                u32: 1
              val:
                u32: 10
            - key:
                string: '1'
              val:
                u32: 20
            - key:
                symbol: '1'
              val:
                u32: 30
        note: 'Keys U32(1), String("1"), Symbol("1"): three distinct keys that collide as native strings;
          the host orders them by type, then value.'
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/1/contract_id
        equals: ${derived.contracts.emitter}
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/1/body/v0
        equals:
          topics:
          - symbol: colliding
          data:
            map:
            - key:
                bool: true
              val:
                u32: 1
            - key:
                u32: 1
              val:
                u32: 2
            - key:
                i32: 1
              val:
                u32: 3
        note: 'Keys Bool(true), U32(1), I32(1): distinct keys that collide as native numbers or booleans.'
      - path: /v2/tx_processing/0/tx_apply_processing/v4/soroban_meta/return_value
        equals:
          vec:
          - map:
            - key:
                u32: 1
              val:
                u32: 10
            - key:
                string: '1'
              val:
                u32: 20
            - key:
                symbol: '1'
              val:
                u32: 30
          - map:
            - key:
                bool: true
              val:
                u32: 1
            - key:
                u32: 1
              val:
                u32: 2
            - key:
                i32: 1
              val:
                u32: 3
      participants:
        must_include:
        - address: ${acct.B}
          roles:
          - source
          - fee_payer
        exact: true
      state_changes: []
      state_changes_exact: true
      movements: []
      movements_exact: true
    fields: {validated: [VF-46a, VF-53a], passed_through: [VF-53b]}

  - id: forged-sac-transfer-event
    entry: cap-0067/forged-token-event-from-unrelated-contract
    tx:
      source_account: "${acct.A}"
      fee: 1000
      seq_num: "${seq.A}"
      cond: none
      memo: none
      operations:
        - source_account: null
          body:
            invoke_host_function:
              host_function:
                invoke_contract:
                  contract_address: "${contract.id(emitter)}"
                  function_name: forged_sac_event
                  args:
                    - {symbol: transfer}
                    - {vec: [{address: "${acct.MARK}"}, {address: "${acct.VICTIM}"}]}
                    - {string: "USD:${acct.I}"}
                    - {i128: "1000000000"}
    simulate: true
    sign: [{key: A}]
    expect_result: tx_success
    expect_op_results: [invoke_host_function.success]
    expect:
      ledger:
        transactions: 1
        operations: 1
        events: 3
        entry_changes: 6
      transactions:
      - index: 0
        hash: ${derived.tx_hash}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
        fee_charged: ${derived.fee_charged}
      values:
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/contract_id
        equals: ${derived.contracts.emitter}
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/events/0/body/v0
        equals:
          topics:
          - symbol: transfer
          - address: ${acct.MARK}
          - address: ${acct.VICTIM}
          - string: USD:${acct.I}
          data:
            i128: '1000000000'
        note: Shaped exactly like a Stellar Asset Contract transfer of USD, but emitted by the emitter contract,
          not by USD's own contract (which is deployed and untouched).
      - path: /v2/tx_processing/0/tx_apply_processing/v4/operations/0/changes
        equals: []
        note: 'No balance, trustline or account changes: nothing moved.'
      participants:
        must_include:
        - address: ${acct.A}
          roles:
          - source
          - fee_payer
        must_not_include:
        - address: ${acct.VICTIM}
          because: named only by a transfer-shaped event of a contract that is not USD's contract; no entry
            of it exists or changed
        - address: ${acct.MARK}
          because: named only as the from of the forged event; no entry of it exists or changed
      state_changes: []
      state_changes_exact: true
      movements:
      - kind: transfer
        op_index: 0
        asset: USD:${acct.I}
        amount: '1000000000'
        from:
          address: ${acct.MARK}
        to:
          address: ${acct.VICTIM}
        count: 0
    fields: {validated: [VF-46a, VF-53a], passed_through: [VF-53b]}

  - id: zero-topics
