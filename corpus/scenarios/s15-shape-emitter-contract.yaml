  # ML-DSA-87 sizes: a 2592-byte public key and a 4627-byte signature, as plain SCV_BYTES arguments
  # (byte i is i mod 256). Two transactions in one ledger, the key first (`${order_nonce}`).
  - id: ml-dsa-key-size
    entry: cap-0087/ml-dsa-sized-byte-arguments
    protocols: [30]
    order: [ml-dsa-key-size, ml-dsa-signature-size]
    tx:
      source_account: "${acct.A}"
      fee: 1000
      seq_num: "${seq.A}"
      cond: {time: {min_time: "${order_nonce}", max_time: "0"}}
      memo: none
      operations:
        - source_account: null
          body:
            invoke_host_function:
              host_function:
                invoke_contract: {contract_address: "${contract.id(emitter)}", function_name: bytes_len, args: [{bytes: ""}]}
    simulate: true
    sign: [{key: A}]
    expect_result: tx_success
    expect_op_results: [invoke_host_function.success]
    expect:
      ledger:
        transactions: 2
        operations: 2
        events: 4
        entry_changes: 12
      transactions:
      - index: 0
        hash: ${derived.tx_hash}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
        fee_charged: ${derived.fee_charged}
      - index: 1
        hash: ${derived.tx_hashes.1}
        successful: true
        result_code: tx_success
        operation_result_codes:
        - invoke_host_function.success
      values:
      - path: /v2/tx_processing/0/tx_apply_processing/v4/soroban_meta/return_value
        equals:
          u32: 2592
        note: bytes_len of the 2592-byte argument (ML-DSA-87 public key size), applied first.
      - path: /v2/tx_processing/1/tx_apply_processing/v4/soroban_meta/return_value
        equals:
          u32: 4627
        note: bytes_len of the 4627-byte argument (ML-DSA-87 signature size).
      participants:
        must_include:
        - address: ${acct.A}
          roles:
          - source
          - fee_payer
        exact: true
      state_changes: []
      state_changes_exact: true
      movements: []
      movements_exact: true
    fields: {validated: [VF-46a, VF-50a], passed_through: [VF-46b]}

  - id: ml-dsa-signature-size
    entry: cap-0087/ml-dsa-sized-byte-arguments
    protocols: [30]
    same_ledger_as: ml-dsa-key-size
