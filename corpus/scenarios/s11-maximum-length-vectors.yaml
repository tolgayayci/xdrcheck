  - fund: {S00: "100", S01: "100", S02: "100", S03: "100", S04: "100", S05: "100", S06: "100", S07: "100", S08: "100", S09: "100", S10: "100", S11: "100", S12: "100", S13: "100", S14: "100", S15: "100", S16: "100", S17: "100", S18: "100", S19: "100", D: "100", W: "100", HD: "100"}

