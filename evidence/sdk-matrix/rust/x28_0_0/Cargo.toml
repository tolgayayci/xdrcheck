[package]
name = "probe_x28_0_0"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe"
path = "../common/main.rs"

[dependencies]
stellar-xdr = { version = "=28.0.0", default-features = false, features = ["std", "base64", "hex"] }
stellar-strkey = "=1.0.0"
sha2 = "0.10"
serde_json = "1"
hex = "0.4"
strkey_old = { package = "stellar-strkey", version = "=0.0.13" }

[features]
p30 = []

[profile.release]
debug = false
