# Conformance columns: stellar-core's own decoder (offline print-xdr).
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# stellar-core's own decoder (offline print-xdr), L0 only: an optional extra column.
[columns."core@30.0.0"]
sdk = "core"
kind = "core"
ecosystem = "other"
package = "stellar-core"
target = "stellar-core"
version = "30.0.0"
role = "extra"
dir = "drivers/core"
run = ["bin/xdrcheck-driver"]
