# Conformance columns: Contract-spec readers: Rust soroban-spec.
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# Rust soroban-spec, the contract-spec reader of the Soroban Rust SDK and stellar-cli: the spec level only.
[columns."soroban-spec@29.0.1"]
sdk = "soroban-spec"
kind = "sdk"
ecosystem = "crates.io"
package = "soroban-spec"
target = "soroban-spec (crates.io)"
version = "29.0.1"
role = "extra"
dir = "drivers/soroban-spec/29.0.1"
run = ["bin/xdrcheck-driver"]
levels = ["spec"]

[columns."soroban-spec@30.0.0-rc.1"]
sdk = "soroban-spec"
kind = "sdk"
ecosystem = "crates.io"
package = "soroban-spec"
target = "soroban-spec (crates.io)"
version = "30.0.0-rc.1"
role = "extra"
dir = "drivers/soroban-spec/30.0.0-rc.1"
run = ["bin/xdrcheck-driver"]
levels = ["spec"]
