# Conformance columns: Python (stellar-sdk).
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# Python: extra columns.
[columns."python@17.0.1"]
sdk = "python"
kind = "sdk"
ecosystem = "pypi"
package = "stellar-sdk"
target = "stellar-sdk (PyPI)"
version = "17.0.1"
role = "extra"
dir = "drivers/python/17.0.1"
run = ["bin/xdrcheck-driver"]

[columns."python@17.0.0"]
sdk = "python"
kind = "sdk"
ecosystem = "pypi"
package = "stellar-sdk"
target = "stellar-sdk (PyPI)"
version = "17.0.0"
role = "extra"
dir = "drivers/python/17.0.0"
run = ["bin/xdrcheck-driver"]
