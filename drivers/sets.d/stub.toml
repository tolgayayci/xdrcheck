# Conformance columns: The orchestrator's test driver.
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# The orchestrator's test driver: canned outcomes, no SDK.
[columns."stub@0.1.0"]
sdk = "stub"
kind = "selftest"
ecosystem = "other"
package = "xdrcheck-driver-stub"
target = "xdrcheck-driver-stub"
version = "0.1.0"
role = "selftest"
dir = "drivers/stub"
run = ["bin/xdrcheck-driver"]
