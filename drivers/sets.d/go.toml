# Conformance columns: Go (go-stellar-sdk): one module per pinned version, and the view-path columns.
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# Go: one module per pinned version.
[columns."go@v0.9.0"]
sdk = "go"
kind = "sdk"
ecosystem = "go"
package = "github.com/stellar/go-stellar-sdk"
target = "github.com/stellar/go-stellar-sdk"
version = "v0.9.0"
role = "required"
dir = "drivers/go/v0.9.0"
run = ["bin/xdrcheck-driver"]

