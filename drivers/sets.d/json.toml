# Conformance columns: XDR-JSON converters (SEP-51): rs-stellar-xdr's converter.
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# XDR-JSON converter (SEP-51): the json level only, on every ledger and xdr variant. The Rust crate at its release
# and at the pinned main commit.
[columns."rs-xdr-json@30.0.0"]
sdk = "rs-xdr-json"
kind = "sdk"
ecosystem = "crates.io"
package = "stellar-xdr"
target = "stellar-xdr (crates.io)"
version = "30.0.0"
role = "extra"
dir = "drivers/rs-xdr-json/30.0.0"
run = ["bin/xdrcheck-driver"]
levels = ["json"]

