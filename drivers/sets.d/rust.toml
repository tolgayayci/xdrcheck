# Conformance columns: Rust stellar-xdr: one crate per version, each under two decode profiles.
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# Rust stellar-xdr: one crate per version, each column under one of two decode profiles.
[columns."rust@30.0.0:limits-default"]
sdk = "rust"
kind = "sdk"
ecosystem = "crates.io"
package = "stellar-xdr"
target = "stellar-xdr (crates.io)"
version = "30.0.0"
profile = "limits-default"
role = "required"
dir = "drivers/rust/30.0.0"
run = ["bin/xdrcheck-driver"]

[columns."rust@30.0.0:limits-none"]
sdk = "rust"
kind = "sdk"
ecosystem = "crates.io"
package = "stellar-xdr"
target = "stellar-xdr (crates.io)"
version = "30.0.0"
profile = "limits-none"
role = "required"
dir = "drivers/rust/30.0.0"
run = ["bin/xdrcheck-driver"]

