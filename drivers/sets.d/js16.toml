# Conformance columns: JavaScript, v16 API generation (@stellar/stellar-sdk 16.x, the LTS line).
# One family per file under drivers/sets.d/, loaded after drivers/sets.toml in name order; the keys are
# described there. A file may also hold [extend]: members it appends to a set drivers/sets.toml defines.

# JavaScript, v16 API generation (the LTS line).
[columns."js@16.4.1"]
sdk = "js"
kind = "sdk"
ecosystem = "npm"
package = "@stellar/stellar-sdk"
target = "@stellar/stellar-sdk"
version = "16.4.1"
role = "extra"
dir = "drivers/js16/16.4.1"
run = ["bin/xdrcheck-driver"]

