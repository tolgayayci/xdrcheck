# The XDRCheck GitHub Action: replay the corpus through your indexer, run SDK conformance, or lint Go ingestion
# code with xdrlint, from prebuilt binaries and the corpus of one pinned release, both checked against the
# release's SHA256SUMS. docs/github-action.md is its manual; action/run.sh does the work.
name: XDRCheck
description: Replay the Stellar XDR corpus through your indexer, check an SDK's conformance, or lint Go ingestion code.
author: XDRCheck
branding:
  icon: check-circle
  color: blue
inputs:
  mode:
    description: "What to run: replay (an indexer through its adapter), conform (SDK drivers) or lint (xdrlint)."
    required: true
  corpus-version:
    description: >-
      The release to use, for example 30.0.0, or a -next release such as 31.0.0-rc.1. Default: the action's own ref
      when it names one release (uses: OWNER/REPO@v30.0.0); with a major tag (@v30) set it.
    default: ""
  sha256sums:
    description: Optional sha256 of the release's SHA256SUMS file; pin it to check every download against your own repository.
    default: ""
  adapter:
    description: "replay: your adapter's command line (the xcc.adapter/1 protocol), run from working-directory."
    default: ""
  target-version:
    description: "replay: the version or commit of the indexer under test, recorded in the report."
    default: ${{ github.sha }}
  input:
    description: "replay: how ledgers reach the indexer: sep54-dir (a plain directory, the default), sep54-s3 or rpc."
    default: sep54-dir
  entries:
    description: Comma-separated entry ID globs to run ('*' crosses '/'); default every entry.
    default: ""
  expected-failures:
    description: >-
      Path to your expected-failure list. replay: `<entry> <variant or -> [unread]` lines; conform: the file
      `xdrcheck conform run --write-expected-failures` writes. The run passes only when its failures are exactly the list.
    default: ""
  require-all-read:
    description: Fail when an entry variant was never read, unless the list names it `unread`.
    default: "false"
  columns:
    description: "conform: the column(s) to run, for example 'js@17.4.0' or 'go@v0.8.0'."
    default: ""
  lint-paths:
    description: "lint: the package patterns, space-separated."
    default: ./...
  lint-args:
    description: "lint: extra xdrlint flags, for example '-fail-on warning'."
    default: ""
  working-directory:
    description: Where relative paths, the adapter and xdrlint run (your module root for lint).
    default: .
  report-dir:
    description: Where the reports go (default a directory under the runner's temp directory).
    default: ""
  artifact-name:
    description: Name of the uploaded report artifact (default xdrcheck-<mode>).
    default: ""
  repository:
    description: OWNER/REPO whose GitHub release holds the assets (default the action's own repository).
    default: ""
  release-base:
    description: Read the release from this URL prefix or local directory instead (a mirror, or a local build's dist/).
    default: ""
outputs:
  result:
    description: pass or fail.
    value: ${{ steps.run.outputs.result }}
  report-dir:
    description: The directory holding REPORT.md, SUMMARY.md and the machine-readable reports.
    value: ${{ steps.run.outputs.report-dir }}
  sarif:
    description: "lint: the SARIF file, for github/codeql-action/upload-sarif."
    value: ${{ steps.run.outputs.sarif }}
runs:
  using: composite
  steps:
    - name: XDRCheck ${{ inputs.mode }}
      id: run
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CORPUS_VERSION: ${{ inputs.corpus-version }}
        INPUT_SHA256SUMS: ${{ inputs.sha256sums }}
        INPUT_ADAPTER: ${{ inputs.adapter }}
        INPUT_TARGET_VERSION: ${{ inputs.target-version }}
        INPUT_INPUT: ${{ inputs.input }}
        INPUT_ENTRIES: ${{ inputs.entries }}
        INPUT_EXPECTED_FAILURES: ${{ inputs.expected-failures }}
        INPUT_REQUIRE_ALL_READ: ${{ inputs.require-all-read }}
        INPUT_COLUMNS: ${{ inputs.columns }}
        INPUT_LINT_PATHS: ${{ inputs.lint-paths }}
        INPUT_LINT_ARGS: ${{ inputs.lint-args }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_REPORT_DIR: ${{ inputs.report-dir }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_RELEASE_BASE: ${{ inputs.release-base }}
        XDRCHECK_ACTION_REPOSITORY: ${{ github.action_repository }}
        XDRCHECK_ACTION_REF: ${{ github.action_ref }}
      run: '"$GITHUB_ACTION_PATH/action/run.sh"'
    - name: Upload the XDRCheck report
      if: always() && steps.run.outputs.report-dir != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: ${{ steps.run.outputs.report-dir }}
        if-no-files-found: warn
        retention-days: 14
