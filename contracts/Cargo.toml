# Test contracts for local-core scenarios (S07, S15, S19).
#
# A separate workspace: the contracts build for `wasm32v1-none` with soroban-sdk,
# which the root workspace must not depend on. `build.sh` is the only supported
# way to produce the vendored wasm in `corpus/contracts/`.
[workspace]
resolver = "2"
members = ["shape-emitter", "custom-account", "token-shape", "tools/wasm-post"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# pins.toml [rust] soroban_sdk: test contracts only (30.0.0 exists only as a release candidate).
soroban-sdk = { version = "=29.0.1" }
# The spec-shaking reference implementation that ships with soroban-sdk 29.0.1.
soroban-spec = { version = "=29.0.1" }
# pins.toml [rust] stellar_xdr.
stellar-xdr = { version = "=30.0.0", default-features = false, features = ["std"] }
sha2 = "0.10"
# pins.toml [rust] stellar_strkey; tests only (builds strkeys of every kind).
stellar-strkey = "=1.0.0"

# Tests run the vendored wasm in the testutils host; an unoptimised host and
# wasm interpreter make that very slow. Dependencies only; contract code stays
# at the default test settings.
[profile.dev.package."*"]
opt-level = 2

# The settings the Soroban runtime expects of a contract build.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
incremental = false
