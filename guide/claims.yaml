  sentence: A 56-character column sized for G and C addresses truncates or rejects M and W (69 characters), B (58)
    and P (69 to 165); a 32- or 33-byte binary column loses the muxed ID, the claimable-balance type byte and the
    signed payload.
  kind: fact
  source:
  - kind: sep
    ref: SEP-23 v1.4.0
  verification: code_reference
  reviewer_status: unreviewed
- claim_id: C-9005
  guide_anchor: '#storage-widths'
  sentence: 'A truncated muxed address can still pass the checksum: SEP-23 says the checksum does not guarantee
    that a strkey was not truncated, and a 56-character truncation of an M address is accepted by the JavaScript
    SDK 16.x and Go SDK v0.7.1 decoders (`strkey/truncated-muxed-address-56-chars`).'
  kind: fact
  source:
  - kind: sep
    ref: SEP-23 v1.4.0
  - kind: probe
    ref: SDK decoding matrix 9S6 (evidence/sdk-matrix)
  - kind: issue
    ref: https://github.com/stellar/wallet-backend/issues/716
  - kind: corpus
    ref: strkey/truncated-muxed-address-56-chars
  verification: executed
  corpus_entries:
  - strkey/truncated-muxed-address-56-chars
  reviewer_status: unreviewed
- claim_id: C-9006
  guide_anchor: '#storage-widths'
  sentence: Store addresses as text of at least 165 characters or unbounded text, or as the base key plus a nullable
    unsigned 64-bit ID plus a separate signer table.
  kind: recommendation
  source:
  - kind: sep
    ref: SEP-23 v1.4.0
  verification: code_reference
  reviewer_status: unreviewed
