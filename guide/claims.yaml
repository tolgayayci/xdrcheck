  guide_anchor: '#shorthand'
  sentence: 'Soroban authorization: matched entries are authenticated, unmatched entries are not. An authorization
    entry that a `require_auth` call matches is fully authenticated: its signature is verified, its nonce is consumed,
    its expiration is checked, and a nonce ledger entry is written (auth.rs L2465-2520, L2586-2720).'
  kind: fact
  source:
  - kind: code
