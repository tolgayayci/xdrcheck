# guide/claims.yaml — claim-to-source map for the indexer-hardening guide (acceptance check guide-review).
# Schema: corpus/schema/claims.schema.json. Checked by scripts/py/check_fields.py (schema, fields,
# entries) and scripts/py/check_guide_claims.py (page tags, sentences, anchors).
#
# Two kinds of record:
# - Field-table claims, for the generated table: the general rule, each validation stage, and for
#   every field row (VF-nn, anchor #vf-nn) its verdict (one claim per part for rows with parts), each
#   core check with its code reference, and the reader_may_assume and reader_must_not_assume sentences.
# - Page claims, one per normative statement of guide/indexer-hardening.mdx, tagged there with
#   {/* claim: C-nnnn */}. Their `sentence` is the page text (links reduced to their text; a table row
#   is one statement, cells joined with " | ") and their `guide_anchor` the enclosing section.
#
# Claim IDs: C-001… general rule and stages; C-NNxx for row VF-NN, where xx = 01-08 verdict (one per
# part, in part order), 09 the row's status detail when the row has parts, 11+ core checks in order,
# 31 reader_may_assume, 32 reader_must_not_assume. Page claims: C-60xx opening, C-61xx validated
# versus unvalidated fields, C-70xx caps, C-80xx participants from meta, C-90xx muxed and
# signed-payload handling.
#
# Rows and parts whose verification is `unverified` (or status `undetermined`) have no claim: the
# guide lists them in its "not yet established" appendix instead. Left out today: VF-14b, VF-45b,
# VF-50c, the reader_must_not_assume sentences of VF-15 and VF-45.
#
# reviewer_status: unreviewed | confirmed | disputed | corrected — changed only by the review.

