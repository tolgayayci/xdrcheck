  findings-acceptance:
    name: P12b findings-check-strict
    needs: [build, static, corpus, generate, unit-rust, unit-go, unit-lint, unit-drivers-a, unit-drivers-b, unit-drivers-c, unit-drivers-d, unit-drivers-e, cli, harness-selftest, memory, replay-acceptance, conformance, lint, guide, coverage, replay-full, replay-etl-known, conformance-public]
    # The findings check in strict mode over every report of the run (findings/README.md): every failure row links a
    # finding record, and every record is filed or resolved. A linter report withheld from the upload is counted from
    # its tally (<target>.tally.json). On main and by hand (PENDING_OK=1) rows awaiting finding review alone do not
    # fail the job: it ends with a warning annotation and the job summary line "N failure rows have no linked issue".
    # Every other failure (a failure row with no finding ID and no pending entry, a stale or expired pending entry, a
    # record not filed, a missing report, a tool error) fails it. On a release tag (v*) the pending rows fail it too.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the reports of the jobs above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - id: setup
        uses: ./.github/actions/setup
        with:
          caches: ""
          fetch: "false"
          save: ""
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-findings-acceptance OFFLINE=1
        env:
          PENDING_OK: ${{ github.ref_type != 'tag' && '1' || '' }}
        # GITHUB_ACTIONS and GITHUB_STEP_SUMMARY are emptied for the tool so that it writes no annotation and no
        # summary line of its own; its pending-only line is reworded, and the next step writes the summary.
        run: |
          GITHUB_ACTIONS= GITHUB_STEP_SUMMARY= make verify-findings-acceptance OFFLINE=1 PENDING_OK="$PENDING_OK" CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK" |& sed -u -E 's/^[A-Z]+-[0-9]+ not met: ([0-9]+) rows? awaits? finding review.*$/\1 failure rows have no linked issue/' | tee "$RUNNER_TEMP/job.log"
      - name: Summary of the reports
        if: always()
        run: python3 -I scripts/ci/job-summary.py job findings-acceptance --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"

  acceptance-report:
    name: P13 run-summary
    needs: [build, static, corpus, generate, unit-rust, unit-go, unit-lint, unit-drivers-a, unit-drivers-b, unit-drivers-c, unit-drivers-d, unit-drivers-e, cli, harness-selftest, memory, replay-acceptance, conformance, lint, guide, coverage, replay-full, replay-etl-known, conformance-public, sdk-ci-recipes, findings]
    # Runs after failed checks too: one table of every job above with its result and the key numbers its own
    # summary states (reports/ci-summary/<job>.txt in its reports artifact). It needs the tools, so not without them.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the reports of the jobs above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - id: setup
        uses: ./.github/actions/setup
        with:
          caches: ""
          fetch: "false"
          save: ""
          rust: "false"
          tools: "true"
          build: "false"
      - name: make acceptance-report OFFLINE=1
        # Writes its report files for the artifact below; its table is not printed (stdout is discarded).
        run: |
          exec > /dev/null
          make acceptance-report OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Run summary
        if: always()
        env:
          JOB_RESULTS: "build=${{ needs.build.result }} static=${{ needs.static.result }} corpus=${{ needs.corpus.result }} generate=${{ needs.generate.result }} unit-rust=${{ needs.unit-rust.result }} unit-go=${{ needs.unit-go.result }} unit-lint=${{ needs.unit-lint.result }} unit-drivers-a=${{ needs.unit-drivers-a.result }} unit-drivers-b=${{ needs.unit-drivers-b.result }} unit-drivers-c=${{ needs.unit-drivers-c.result }} unit-drivers-d=${{ needs.unit-drivers-d.result }} unit-drivers-e=${{ needs.unit-drivers-e.result }} cli=${{ needs.cli.result }} harness-selftest=${{ needs.harness-selftest.result }} memory=${{ needs.memory.result }} replay-acceptance=${{ needs.replay-acceptance.result }} conformance=${{ needs.conformance.result }} lint=${{ needs.lint.result }} guide=${{ needs.guide.result }} coverage=${{ needs.coverage.result }} replay-full=${{ needs.replay-full.result }} replay-etl-known=${{ needs.replay-etl-known.result }} conformance-public=${{ needs.conformance-public.result }} sdk-ci-recipes=${{ needs.sdk-ci-recipes.result }} findings=${{ needs.findings.result }}"
        run: python3 -I scripts/ci/job-summary.py run --summary "$GITHUB_STEP_SUMMARY"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Upload the run's reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-summary-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
