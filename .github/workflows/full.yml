# The full CI (tier 2): every check at full size, one job per check in docs/architecture.md (section CI), each running
# exactly one `make` target, the same command a contributor runs locally. It runs by hand (workflow_dispatch) and on
# release tags; the pull-request CI (pr.yml, tier 1) runs the fast forms of the slow checks on every
# pull request and branch. The build job runs `make build` once and hands the tools to every other job (artifact
# `tools`); a job names them on the make command line (CORPUS, MUTATE, XDRCHECK, set by the setup action), and the
# Makefile runs a tool given that way as it is instead of building it again. Each job then fetches only the parts its
# target needs (`make fetch FETCH_ONLY=...` through .github/actions/setup, the only networked step) and restores only
# its own caches; the job's own step runs with OFFLINE=1, so the Makefile wraps it in scripts/offline-run.sh (a
# namespace with no network). No job downloads a data set, apart from P18, which fetches the mainnet tier's public-lake
# objects into its cache (docs/ci-timings.md lists what each job fetches). A job whose tool is not built fails loudly;
# nothing here hides a failure. No schedule and no run on a push: a manual run and release tags (v*) are the triggers.
# P14 to P16 add the full-size runs the pull-request CI does not make, P12b the findings check in strict mode (rows
# awaiting finding review alone fail it only on a release tag; on main they leave a warning), and P13 one table of
# every job's result and key numbers. Each job writes the key lines of its own reports to its job summary
# (scripts/ci/job-summary.py). stellar-core's golden emission (AG-2, make verify-goldens-nightly) takes about 20 minutes on 8 CPUs and
# stays in the manual nightly-goldens workflow.
name: full
run-name: "full ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}"

on:
  push:
    # A release tag runs the whole tier.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"

jobs:

  build:
    name: P0 build (make build)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A tag's run checks that the tag is on the default branch, which needs the history.
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - name: Release tags must point at the default branch
        if: github.ref_type == 'tag'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH"
            exit 1
          fi
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: build
          caches: cargo cargo-target go go-build
          save: cargo go
          fetch: cargo gomod
          build: "false"
      - name: make build (network off)
        run: scripts/offline-run.sh make build
      - name: Save cargo target
        if: steps.setup.outputs.cargo-target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.setup.outputs.cargo-target-key }}
      - name: Save Go build cache
        if: steps.setup.outputs.go-build-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.setup.outputs.go-build-key }}
      - name: Pack the tools
        run: |
          mapfile -t rust < <(find target/release -maxdepth 1 -type f -executable)
          tar -cf "$RUNNER_TEMP/tools.tar" bin go/bin lint/bin "${rust[@]}"
          ls -l "$RUNNER_TEMP/tools.tar"
      - name: Upload the tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools
          path: ${{ runner.temp }}/tools.tar
          retention-days: 1

  static:
    name: P1 static (make verify-static)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: static
          caches: ""
          fetch: py
          save: ""
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-static OFFLINE=1
        run: make verify-static OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-static
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  corpus:
    name: P2 corpus (make verify-corpus)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: corpus
          caches: ""
          fetch: goldens
          save: fetch
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-corpus OFFLINE=1
        run: make verify-corpus OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job corpus --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-corpus
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  generate:
    name: P3 generate (make verify-generate)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
