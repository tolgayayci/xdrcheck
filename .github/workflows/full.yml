          retention-days: 14

  unit-rust:
    name: P4a unit-rust (make test-rust)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: unit-rust
          caches: cargo cargo-test
          fetch: deps seaweedfs goldens core
          save: fetch
          tools: "true"
          free-disk: "true"
          build: "false"
      - name: make test-rust OFFLINE=1
        # The stellar-core package is fetched (part core), so the tests that run it (tests/gen*.rs) fail instead of
        # skipping when it cannot be found. The pull-request CI does not fetch it, and they skip there.
        env:
          XDRCHECK_REQUIRE_CORE: "1"
        run: make test-rust OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK" |& tee "$RUNNER_TEMP/job.log"
      - name: Save cargo target (test build)
        if: always() && steps.setup.outputs.cargo-test-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The same paths as the restore in .github/actions/setup (cargo-test): the test build, not the scratch
          # copies the tests leave in target/tmp, the tools of target/release or the runners' logs.
          path: |
            target
            !target/tmp
            !target/release
            !target/test-parallel
            !target/test-drivers
          key: ${{ steps.setup.outputs.cargo-test-key }}
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job unit-rust --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-rust
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

