          cache-name: replay-acceptance
          go-build-name: build
          caches: go go-build
          fetch: gomod wallet-backend
          save: fetch
          rust: "false"
          tools: "false"
          free-disk: "true"
          build: "false"
      - name: make verify-replay-pr OFFLINE=1
        run: make verify-replay-pr OFFLINE=1
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job replay --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-replay
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  conformance-js:
    name: conformance-js (make verify-conformance-js)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # It needs nothing the build job makes, so it starts with it. The make target builds xdrcheck.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: conformance-js
          go-build-name: build
          caches: go go-build
          fetch: gomod driver:js
          save: fetch
          rust: "false"
          tools: "false"
          build: "false"
      - name: make verify-conformance-js OFFLINE=1
        run: make verify-conformance-js OFFLINE=1
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job conformance-js --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-conformance-js
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: lint (make verify-lint-pr)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # It needs nothing the build job makes, so it starts with it. The lint script builds xdrlint.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: lint-pr
          go-build-name: build
          caches: go-build
          own-gomod: "true"
          fetch: py gomod lint-sources-wb
          save: fetch
          rust: "false"
          tools: "false"
          build: "false"
      - name: make verify-lint-pr OFFLINE=1
        run: make verify-lint-pr OFFLINE=1
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job lint --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-lint
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  guide:
    name: guide (make verify-guide)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: guide
          go-build-name: build
          caches: go go-build
          fetch: py gomod docs
          save: fetch
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-guide
        # The fetch caches the pinned docs repository and its packages, so the documentation repository's own
        # commands run here with the network unreachable too.
        run: make verify-guide OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job guide --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-guide
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: coverage (make verify-coverage)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          caches: ""
          fetch: "false"
          save: ""
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-coverage OFFLINE=1
        run: make verify-coverage OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK" |& tee "$RUNNER_TEMP/job.log"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job coverage --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-coverage
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  findings:
    name: findings (make verify-findings)
    needs: [build, static, corpus, generate, unit-rust, unit-go, unit-lint, unit-drivers-a, unit-drivers-b, unit-drivers-c, unit-drivers-d, unit-drivers-e, cli, replay, conformance-js, lint, guide, coverage]
    # Runs after failed checks too: its job is to account for them. It needs the tools, so not without them.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the reports of the jobs above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - id: setup
        uses: ./.github/actions/setup
        with:
          caches: ""
          fetch: "false"
          save: ""
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-findings OFFLINE=1
        run: make verify-findings OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK" |& tee "$RUNNER_TEMP/job.log"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job findings --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-findings
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  acceptance-report:
    name: run-summary
    needs: [build, static, corpus, generate, unit-rust, unit-go, unit-lint, unit-drivers-a, unit-drivers-b, unit-drivers-c, unit-drivers-d, unit-drivers-e, cli, replay, conformance-js, lint, guide, coverage, findings]
    # Runs after failed checks too: one table of every job above with its result and the key numbers its own
    # summary states (reports/ci-summary/<job>.txt in its reports artifact). It needs the tools, so not without them.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the reports of the jobs above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - id: setup
        uses: ./.github/actions/setup
        with:
          caches: ""
          fetch: "false"
          save: ""
          rust: "false"
          tools: "true"
          build: "false"
      - name: make acceptance-report-pr OFFLINE=1
        # Writes its report files for the artifact below; its table is not printed (stdout is discarded).
        run: |
          exec > /dev/null
          make acceptance-report-pr OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Run summary
        if: always()
        env:
          JOB_RESULTS: "build=${{ needs.build.result }} static=${{ needs.static.result }} corpus=${{ needs.corpus.result }} generate=${{ needs.generate.result }} unit-rust=${{ needs.unit-rust.result }} unit-go=${{ needs.unit-go.result }} unit-lint=${{ needs.unit-lint.result }} unit-drivers-a=${{ needs.unit-drivers-a.result }} unit-drivers-b=${{ needs.unit-drivers-b.result }} unit-drivers-c=${{ needs.unit-drivers-c.result }} unit-drivers-d=${{ needs.unit-drivers-d.result }} unit-drivers-e=${{ needs.unit-drivers-e.result }} cli=${{ needs.cli.result }} replay=${{ needs.replay.result }} conformance-js=${{ needs.conformance-js.result }} lint=${{ needs.lint.result }} guide=${{ needs.guide.result }} coverage=${{ needs.coverage.result }} findings=${{ needs.findings.result }}"
        run: python3 -I scripts/ci/job-summary.py run --summary "$GITHUB_STEP_SUMMARY"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Upload the run's reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-summary-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
