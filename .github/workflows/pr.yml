        run: python3 -I scripts/ci/job-summary.py job unit-drivers-a --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-drivers-a
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  unit-drivers-b:
    name: unit-drivers-b (make test-drivers, JavaScript, stellar-core)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # It needs nothing the build job makes, so it starts with it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: unit-drivers-b
          caches: ""
          fetch: py driver:js driver:js16 driver:core driver:stub
          save: fetch
          rust: "false"
          tools: "false"
          free-disk: "false"
          build: "false"
      - name: make test-drivers OFFLINE=1 DRIVERS=js,js16,core,stub
        run: make test-drivers OFFLINE=1 DRIVERS=js,js16,core,stub |& tee "$RUNNER_TEMP/job.log"
      - name: Withhold sites awaiting finding review
        id: withhold
