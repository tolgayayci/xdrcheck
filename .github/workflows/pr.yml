    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # It needs nothing the build job makes, so it starts with it. The make target builds xdrcheck; the script builds the adapter.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
