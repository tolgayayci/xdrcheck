      - name: make test-go-fast OFFLINE=1 GO_MODULES=lint
        run: make test-go-fast OFFLINE=1 GO_MODULES=lint |& tee "$RUNNER_TEMP/job.log"
      - name: Save Go build cache
        if: always() && steps.setup.outputs.go-build-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.setup.outputs.go-build-key }}
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job unit-lint --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-lint
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  unit-drivers-a:
    name: unit-drivers-a (make test-drivers, Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # It needs nothing the build job makes, so it starts with it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: unit-drivers-a
          caches: ""
          fetch: py driver:python
          save: fetch
          rust: "false"
          tools: "false"
          free-disk: "false"
          build: "false"
      - name: make test-drivers OFFLINE=1 DRIVERS=python@17.0.0,python@17.0.1
        run: make test-drivers OFFLINE=1 DRIVERS=python@17.0.0,python@17.0.1 |& tee "$RUNNER_TEMP/job.log"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
