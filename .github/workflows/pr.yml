# The pull-request CI (tier 1): on every pull request and every push to a branch other than main, in about 15 minutes
# on warm caches and 25 on cold ones (docs/ci-timings.md). It runs the static, corpus, generate, guide and coverage
# checks at full size, the unit tests in their fast form (`make test-fast`: every Rust test with the test binaries
# side by side, the Go tests with -short, every driver's tests, the command-line reference), and the reproductions
# in reduced form with the same assertions: the wallet-backend pairs on one input (`make verify-replay-pr`), the
# three js-stellar-sdk assertions on their JavaScript columns without the rest of the matrix (`make
# verify-conformance-js`), the linter on its fixtures and the current wallet-backend commit (`make verify-lint-pr`).
# The findings check reads what these jobs made, and run-summary prints one table of every job's result and key numbers;
# each job writes the key lines of its own reports to its job summary (scripts/ci/job-summary.py). The full CI
# (full.yml, tier 2) runs every check at full size, by hand and on release tags. Each job runs exactly one `make` target, the same command a contributor runs locally. The build job runs `make
# build` once and hands the tools to the jobs that need them (artifact `tools`), which name them on the make command
# line (CORPUS, MUTATE, XDRCHECK, set by the setup action); the jobs that need nothing it makes (unit-rust, unit-go,
# unit-drivers, replay, conformance-js, lint) start with it. Each job fetches only the parts its target needs (`make
# fetch FETCH_ONLY=...` through .github/actions/setup, the only networked step) and restores only its own caches; the
# job's own step runs with OFFLINE=1 (scripts/offline-run.sh: no network). No job downloads a data set
# (docs/ci-timings.md lists what each job fetches); nothing here hides a failure.
name: Pull request
run-name: "Pull request ${{ github.event_name == 'pull_request' && format('#{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"

jobs:

  build:
    name: build (make build)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: build
          caches: cargo cargo-target go go-build
          save: cargo go
          fetch: cargo gomod
          build: "false"
      - name: make build (network off)
        run: scripts/offline-run.sh make build
      - name: Save cargo target
        if: steps.setup.outputs.cargo-target-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.setup.outputs.cargo-target-key }}
      - name: Save Go build cache
        if: steps.setup.outputs.go-build-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.setup.outputs.go-build-key }}
      - name: Pack the tools
        run: |
          mapfile -t rust < <(find target/release -maxdepth 1 -type f -executable)
          tar -cf "$RUNNER_TEMP/tools.tar" bin go/bin lint/bin "${rust[@]}"
          ls -l "$RUNNER_TEMP/tools.tar"
      - name: Upload the tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools
          path: ${{ runner.temp }}/tools.tar
          retention-days: 1

  static:
    name: static (make verify-static)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: static
          caches: ""
          fetch: py
          save: ""
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-static OFFLINE=1
        run: make verify-static OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-static
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  corpus:
    name: corpus (make verify-corpus)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: corpus
          caches: ""
          fetch: goldens
          save: fetch
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-corpus OFFLINE=1
        run: make verify-corpus OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job corpus --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-corpus
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  generate:
    name: generate (make verify-generate)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: generate
          caches: ""
          fetch: core
          save: fetch
          rust: "false"
          tools: "true"
          build: "false"
      - name: make verify-generate OFFLINE=1
        run: make verify-generate OFFLINE=1 CORPUS="$CORPUS" MUTATE="$MUTATE" XDRCHECK="$XDRCHECK"
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-generate
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  unit-rust:
    name: unit-rust (make test-rust-fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # It needs nothing the build job makes, so it starts with it. It fetches the golden tree: the tests that run the
    # default `xdrcheck-corpus verify` (tests/verify.rs, tests/render.rs) include the ag1/ag3 checks, which read it.
    # Without the stellar-core package (part core, fetched by the full CI's unit-rust) the tests that run stellar-core
    # (tests/gen*.rs) skip here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: unit-rust
          caches: cargo cargo-test
          fetch: cargo goldens
          save: ""
          tools: "false"
          free-disk: "true"
          build: "false"
      - name: make test-rust-fast OFFLINE=1
        run: make test-rust-fast OFFLINE=1 |& tee "$RUNNER_TEMP/job.log"
      - name: Save cargo target (test build)
        if: always() && steps.setup.outputs.cargo-test-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The same paths as the restore in .github/actions/setup (cargo-test): the test build, not the scratch
          # copies the tests leave in target/tmp, the tools of target/release or the runners' logs.
          path: |
            target
            !target/tmp
            !target/release
            !target/test-parallel
            !target/test-drivers
          key: ${{ steps.setup.outputs.cargo-test-key }}
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job unit-rust --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-rust
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  unit-go:
    name: unit-go (make test-go-fast GO_MODULES=go)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # It needs nothing the build job makes, so it starts with it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: unit-go
          caches: go go-build
          fetch: py gomod seaweedfs
          save: ""
          rust: "false"
          tools: "false"
          build: "false"
      - name: make test-go-fast OFFLINE=1 GO_MODULES=go
        run: make test-go-fast OFFLINE=1 GO_MODULES=go |& tee "$RUNNER_TEMP/job.log"
      - name: Save Go build cache
        if: always() && steps.setup.outputs.go-build-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.setup.outputs.go-build-key }}
      - name: Withhold sites awaiting finding review
        id: withhold
        if: always()
        run: python3 -I scripts/ci/withhold-pending.py reports/
      - name: Summary of the reports
        if: always() && steps.withhold.outcome == 'success'
        run: python3 -I scripts/ci/job-summary.py job unit-go --log "$RUNNER_TEMP/job.log" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always() && steps.withhold.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-unit-go
          path: reports/
          if-no-files-found: ignore
          retention-days: 14


  unit-lint:
    name: unit-lint (make test-go-fast GO_MODULES=lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
