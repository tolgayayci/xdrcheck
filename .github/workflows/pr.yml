        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-name: unit-drivers-c
          caches: ""
          fetch: py driver:go/v0.7.1 driver:go/v0.7.2 driver:go/v0.7.3
          save: fetch
          rust: "false"
          tools: "false"
          free-disk: "true"
          build: "false"
      - name: make test-drivers OFFLINE=1 DRIVERS=go@v0.7.1,go@v0.7.2,go@v0.7.3
        run: make test-drivers OFFLINE=1 DRIVERS=go@v0.7.1,go@v0.7.2,go@v0.7.3 |& tee "$RUNNER_TEMP/job.log"
      - name: Withhold sites awaiting finding review
