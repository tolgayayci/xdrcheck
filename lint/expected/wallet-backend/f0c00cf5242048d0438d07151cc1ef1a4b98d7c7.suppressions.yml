  reason: "Hardening note, not a defect: walkInvocation recurses once per sub-invocation with no explicit depth bound, but the tree was decoded by go-stellar-sdk, whose decoder stops at 1500 depth units (go-xdr DecodeDefaultMaxDepth), stellar-core admits an envelope only within its own decoder depth, and Go stacks grow, so no decodable depth can overflow the walk; no level merges its children's results. At this commit only successful transactions reach it (ProcessOperation returns at line 50 when the transaction failed); the warning stands as advice to add an explicit cap (HC-201) and is not counted as a pipeline failure."
