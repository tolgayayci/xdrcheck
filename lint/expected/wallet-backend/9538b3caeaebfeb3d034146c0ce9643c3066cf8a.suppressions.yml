- rule: XDR201
  file: internal/indexer/processors/contract_deploy.go
  function: ContractDeployProcessor.ProcessOperation
  line: 104
  reason: "Hardening note, not a defect: walkInvocation recurses once per sub-invocation with no explicit depth bound, but the tree was decoded by go-stellar-sdk, whose decoder stops at 1500 depth units (go-xdr DecodeDefaultMaxDepth), stellar-core admits an envelope only within its own decoder depth, and Go stacks grow, so no decodable depth can overflow the walk; no level merges its children's results. At this commit the walk also runs for failed transactions (ProcessOperation has no success check yet), whose envelopes pass the same decoder limit; the warning stands as advice to add an explicit cap (HC-201) and is not counted as a pipeline failure."
  finding: F-0068
  commit: 9538b3caeaebfeb3d034146c0ce9643c3066cf8a
  reviewer: kit maintainer
