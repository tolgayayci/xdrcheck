- rule: XDR405
  file: internal/transform/operation.go
  function: transactionOperationWrapper.parseAssetBalanceChangesFromContractEvents
  line: 1889
  reason: "asset_balance_changes are built from GetDiagnosticEvents() with no check that the transaction succeeded, here or in any caller (filterEvents keeps InSuccessfulContractCall, the call's outcome, not the transaction's), so a failed Soroban transaction gets rows for rolled-back transfers. Recorded upstream as stellar/stellar-etl#488, opened by a stellar-etl maintainer and open (checked 2026-11-19)."
  finding: F-0086
  commit: 7e3fc9af95359dad6ba939fa88791f49cdf531ae
